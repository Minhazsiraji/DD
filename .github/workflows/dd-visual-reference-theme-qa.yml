name: DD visual reference theme QA

on:
  push:
    branches:
      - md2/dd-visual-reference-theme-01

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Verify authoritative presentation blobs
        shell: bash
        run: |
          test "$(git hash-object src/app/global-background-test.css)" = "062f35853c07cf72e7f6d6438878a2e9f4ff6b79"
          test "$(git hash-object src/app/canonical-brand.css)" = "bb5b7b496826e8f593266facab9c2319c410c799"
          test "$(git hash-object src/app/app-unified-liquid.css)" = "a35db74b73aa843caf5086d72a4fdae006f244c8"
          test "$(git hash-object src/app/dd-material-system.css)" = "eea7e0691a67a5d8df231537a4247a5c5806b934"
          test "$(git hash-object public/dd-global-bg.webp)" = "e50c9e62d3340206d18724784a94a9a295c3851c"

      - name: Verify functional-integrity scope
        shell: bash
        run: |
          git diff --name-only f0c7c6c10de3868397e3846c96b02eb396480e7c...HEAD > /tmp/theme-files.txt
          cat /tmp/theme-files.txt
          if grep -E '^(db/|supabase/|scripts/|src/lib/|src/features/(patients|appointments|queue|consultation|prescriptions|investigations|security)/)' /tmp/theme-files.txt; then
            echo "Forbidden functional/security/data path changed"
            exit 1
          fi

      - name: Verify print canvas lock
        shell: bash
        run: |
          grep -q '@media print' src/app/global-background-test.css
          grep -q 'background: #ffffff !important' src/app/global-background-test.css
          grep -q 'content: none !important' src/app/global-background-test.css

      - name: Browser smoke screenshots — public and auth at required viewports
        shell: bash
        run: |
          npx -y playwright@1.55.0 install --with-deps chromium
          mkdir -p qa-screens
          REF='https://dd-git-md2-inv1-ui-02-layout-fix-minhazs-projects-d28f7aed.vercel.app'
          TARGET='https://dd-git-md2-dd-visual-reference-1dc6b6-minhazs-projects-d28f7aed.vercel.app'
          for size in 1440,900 1024,768 390,844; do
            tag=$(echo "$size" | tr ',' 'x')
            npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="$size" --wait-for-timeout=1500 "$REF/" "qa-screens/reference-home-$tag.png"
            npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="$size" --wait-for-timeout=1500 "$TARGET/" "qa-screens/target-home-$tag.png"
            npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="$size" --wait-for-timeout=1500 "$REF/login" "qa-screens/reference-login-$tag.png"
            npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="$size" --wait-for-timeout=1500 "$TARGET/login" "qa-screens/target-login-$tag.png"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dd-visual-reference-theme-screens
          path: qa-screens
          if-no-files-found: ignore
