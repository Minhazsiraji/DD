name: P-C1 Final Integrated Pilot Gate

on:
  push:
    branches:
      - integration/pilot-final-composite
  workflow_dispatch:

permissions:
  contents: read

env:
  M4_BASE: b7590d276cdad428d99901d1f26d9864b52359c0
  NEXT_PUBLIC_SUPABASE_URL: https://synthetic-pc1.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_pc1_synthetic_key_000000000000000000000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  AI_MODE: mock
  NOTIFICATION_MODE: mock
  PAYMENT_MODE: mock
  PA1_PROPOSAL_SIGNING_SECRET: pc1-signing-secret-at-least-32-bytes-long
  CRON_SECRET: pc1-cron-secret-at-least-32-bytes-long
  O1_PILOT_CLOSE_TIME_ZONE: Asia/Dhaka

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pc1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pc1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact composite SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile
        run: npm ci --ignore-scripts

      - name: Frozen authority and migration manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$M4_BASE" HEAD)" = "$M4_BASE"
          test "$(git rev-parse HEAD:src/features/encounters/components/consultation-workspace.tsx)" = "749f53f2a9dd1fef1474f2fbe6b5fe9bd7c17113"
          test "$(git rev-parse HEAD:src/features/encounters/components/investigation-panel.tsx)" = "bde1eedf119ba5aaa597d76892c3d524283b0961"
          test "$(git rev-parse HEAD:src/features/encounters/investigation-v1-read-actions.ts)" = "28e2c217fe42832d6f2c066d8a62cf7355187db4"
          test "$(git rev-parse HEAD:src/features/encounters/investigation-v1-ui.test.ts)" = "700983430a3adb01238123bf4a3f5aedfb62814a"
          test "$(git rev-parse HEAD:src/features/encounters/investigation-v1-ui.ts)" = "e91c2ac616a20521ddcb56d9a76464d86f8ad704"
          test "$(git rev-parse HEAD:src/features/encounters/investigation-v1-actions.ts)" = "0d848ef8eb12ba0e274f3e62e2e583d14e19bc56"
          test "$(git rev-parse HEAD:src/features/encounters/investigation-v1-queries.ts)" = "2bbbd5cb7a9f649e859834b59d1b64bf080318de"
          test "$(git rev-parse HEAD:src/features/encounters/investigation-v1-contract.ts)" = "c760423862f94b408d579284e1c1acd61fc9b60d"
          test "$(git rev-parse HEAD:supabase/policies/0046_investigation_v1_foundation.sql)" = "5e105f3015f1251279e3ba94b5c3b745998b8e22"
          test "$(git rev-parse HEAD:supabase/policies/0047_o1_owner_analytics_authority.sql)" = "b8645248fc22a98a2c2aa10f1b21ad0b5c9679d6"
          test "$(sha256sum supabase/policies/0047_o1_owner_analytics_authority.sql | awk '{print $1}')" = "3a316805d32391241ed506ec9627d9e77b21b20a0a4c1f36405b03e0695a2190"
          test ! -e supabase/policies/0048_o1_owner_analytics_authority.sql
          for f in supabase/policies/004{1,2,3,4,5,6,7}_*.sql supabase/policies/004{8,9}_*.sql supabase/policies/005{0,1}_*.sql; do
            test "$(git rev-parse HEAD:$f)" = "$(git rev-parse $M4_BASE:$f)"
          done
          printf '%s\n' \
            .github/workflows/pc1-final-integrated-gate.yml \
            package-lock.json package.json \
            src/features/encounters/components/consultation-workspace.tsx \
            src/features/encounters/components/investigation-panel.tsx \
            src/features/encounters/investigation-v1-actions.ts \
            src/features/encounters/investigation-v1-contract.ts \
            src/features/encounters/investigation-v1-queries.ts \
            src/features/encounters/investigation-v1-read-actions.ts \
            src/features/encounters/investigation-v1-ui.test.ts \
            src/features/encounters/investigation-v1-ui.ts | sort > /tmp/allowed
          git diff --name-only "$M4_BASE"...HEAD | sort > /tmp/actual
          diff -u /tmp/allowed /tmp/actual
          echo "PC1_AUTHORITY_AND_MIGRATION_MANIFEST=PASS"

      - name: Proven dependency graph
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const p=require('./package.json');
          const l=require('./package-lock.json');
          const expected={next:'16.3.4',vitest:'4.1.11',sharp:'0.35.4','js-yaml':'4.3.2',hono:'4.13.7'};
          if(p.dependencies.next!==expected.next) throw new Error(`next=${p.dependencies.next}`);
          if(p.devDependencies.vitest!==expected.vitest) throw new Error(`vitest=${p.devDependencies.vitest}`);
          for (const [name,v] of Object.entries(expected)) {
            const a=l.packages?.[`node_modules/${name}`]?.version;
            if(a!==v) throw new Error(`${name}=${a}, expected ${v}`);
            console.log(`PC1_DEP_VERSION ${name}=${a}`);
          }
          NODE
          npm ls next sharp js-yaml hono vitest --all

      - name: M3 Prescription regression
        run: npx vitest run src/features/prescriptions

      - name: Investigation regression
        shell: bash
        run: |
          set -euo pipefail
          files=$(find src/features/encounters -type f -iname '*investigation*.test.ts' -print)
          test -n "$files"
          npx vitest run $files

      - name: M4 Medicine regression
        run: npx vitest run src/features/medicines

      - name: O1 F-I2 disposable verifier regression
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d pc1 -v ON_ERROR_STOP=1 <<'SQL'
          do $bootstrap$
          begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role noinherit bypassrls; end if;
            if not exists (select 1 from pg_roles where rolname='authenticator') then create role authenticator login password 'qa_test_only' noinherit; end if;
          end
          $bootstrap$;
          grant anon, authenticated, service_role to authenticator;
          SQL
          for db in o1i1 o1r3 o1aal2 o1isolation o1daygrain; do
            createdb -h 127.0.0.1 -U postgres "$db"
            psql -h 127.0.0.1 -U postgres -d "$db" -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key default gen_random_uuid());
          create or replace function auth.uid() returns uuid language sql stable as $uid$
            select nullif(coalesce(nullif(current_setting('request.jwt.claims', true), ''), '{}')::jsonb ->> 'sub','')::uuid;
          $uid$;
          create or replace function auth.jwt() returns jsonb language sql stable as $jwt$
            select coalesce(nullif(current_setting('request.jwt.claims', true), ''), '{}')::jsonb;
          $jwt$;
          grant usage on schema auth to public;
          grant execute on function auth.uid() to public;
          grant execute on function auth.jwt() to public;
          SQL
          done
          DB=postgresql://postgres:postgres@127.0.0.1:5432
          AUTH=postgresql://authenticator:qa_test_only@127.0.0.1:5432
          DATABASE_URL=$DB/o1i1 DIRECT_URL=$DB/o1i1 AUTHENTICATOR_URL=$AUTH/o1i1 node scripts/verify-o1f-i1-contract.mjs
          DATABASE_URL=$DB/o1r3 DIRECT_URL=$DB/o1r3 AUTHENTICATOR_URL=$AUTH/o1r3 node scripts/verify-o1f-r3-contract.mjs
          DATABASE_URL=$DB/o1aal2 DIRECT_URL=$DB/o1aal2 AUTHENTICATOR_URL=$AUTH/o1aal2 node scripts/verify-o1f-owner-aal2-and-consent.mjs
          DATABASE_URL=$DB/o1isolation DIRECT_URL=$DB/o1isolation AUTHENTICATOR_URL=$AUTH/o1isolation node scripts/verify-o1f-pilot-plane-isolation.mjs
          DATABASE_URL=$DB/o1daygrain DIRECT_URL=$DB/o1daygrain AUTHENTICATOR_URL=$AUTH/o1daygrain node scripts/verify-o1f-activity-day-grain.mjs

      - name: O1 runtime focused regression
        run: >-
          npx vitest run
          src/features/engagement/durable-ingest.test.ts
          src/features/engagement/reconciliation.test.ts
          src/features/engagement/close-schedule.test.ts
          src/features/ai/telemetry-durable-sink.test.ts
          src/features/prescriptions/service-key-containment.test.ts

      - name: Security verifier regression
        run: >-
          npx vitest run
          src/features/security/prelaunch-sec01b.test.ts
          src/features/security/post-mfa-destination.test.ts

      - name: Full repository tests
        run: npm test

      - name: Generate Next route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff whitespace
        run: git diff --check "$M4_BASE"...HEAD

      - name: Production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node <<'NODE'
          const a=require('/tmp/audit-prod.json');
          const v=a.metadata?.vulnerabilities ?? {};
          const total=v.total ?? Object.entries(v).filter(([k])=>k!=='total').reduce((s,[,n])=>s+(Number(n)||0),0);
          console.log(`PC1_PROD_AUDIT_LOW=${v.low ?? 0}`);
          console.log(`PC1_PROD_AUDIT_MODERATE=${v.moderate ?? 0}`);
          console.log(`PC1_PROD_AUDIT_HIGH=${v.high ?? 0}`);
          console.log(`PC1_PROD_AUDIT_CRITICAL=${v.critical ?? 0}`);
          console.log(`PC1_PROD_AUDIT_TOTAL=${total}`);
          if((v.high ?? 0)!==0 || (v.critical ?? 0)!==0) process.exit(1);
          NODE

      - name: Record exact verified SHA
        run: echo "PC1_FINAL_VERIFIED_SHA=${GITHUB_SHA}"
