name: Loop C Medicines Migration Audit

on:
  push:
    branches:
      - audit/loop-c-medicines-v1

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure isolated database
        run: printf '%s\n' 'DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres' 'DIRECT_URL=postgres://postgres:postgres@localhost:5432/postgres' > .env.local
      - name: Migration replay verifier
        run: npm run db:verify:migrations
