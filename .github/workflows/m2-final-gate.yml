name: M2 Final Quality Gate

on:
  push:
    branches:
      - qa/m2-final-gate-3

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://qa-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: qa-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      AI_MODE: mock
      NOTIFICATION_MODE: mock
      PAYMENT_MODE: mock
      M2_BASE: da622f91289ad840d040761448dcd653105aaec1
      M2_TARGET: 1147e993158f9abee80a5307cf9932ff95cb43bb
    steps:
      - name: Checkout exact M2 candidate
        uses: actions/checkout@v4
        with:
          ref: 1147e993158f9abee80a5307cf9932ff95cb43bb
          fetch-depth: 0

      - name: Confirm exact candidate
        run: test "$(git rev-parse HEAD)" = "$M2_TARGET"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused M2 tests
        run: npm test -- --run src/features/encounters/m2-consultation-workspace.test.ts src/features/encounters/m2-responsive-widths.test.ts src/features/encounters/follow-up-dates.test.ts src/features/encounters/fast-entry.test.ts

      - name: Relevant M1 regression
        run: npm test -- --run src/features/patients/m1-implementation.test.ts src/features/patients/finder-ranking.test.ts src/features/mobile-responsive.test.ts src/components/layout/nav-targets.test.ts

      - name: Full test suite
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Generate Next route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Diff whitespace check
        run: git diff --check "$M2_BASE..$M2_TARGET"

      - name: Protected DB drift and SQL/service-role check
        shell: bash
        run: |
          set -euo pipefail
          drift="$(git diff --name-only "$M2_BASE..$M2_TARGET" -- db/schema db/functions db/policies db/grants db/storage db/seed db/manifest.toml db/golden-p0.sql)"
          test -z "$drift" || { echo "Protected DB drift:"; echo "$drift"; exit 1; }
          sql="$(git diff --name-only "$M2_BASE..$M2_TARGET" -- '*.sql')"
          test -z "$sql" || { echo "SQL changes:"; echo "$sql"; exit 1; }
          added_service_role="$(git diff -U0 "$M2_BASE..$M2_TARGET" -- 'src/**' ':!**/*.test.ts' ':!**/*.test.tsx' | grep -E '^\+.*service_role' || true)"
          test -z "$added_service_role" || { echo "service_role added in runtime source:"; echo "$added_service_role"; exit 1; }

      - name: Preserve Seoul region
        run: node -e 'const v=require("./vercel.json"); if(JSON.stringify(v.regions)!==JSON.stringify(["icn1"])) process.exit(1)'
