name: Loop C Medicines DB Audit

on:
  push:
    branches:
      - audit/loop-c-medicines-v1

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure isolated local database
        run: |
          printf '%s\n' 'DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres' 'DIRECT_URL=postgres://postgres:postgres@localhost:5432/postgres' > .env.local
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres <<'SQL'
          create extension if not exists pgcrypto;
          create schema if not exists extensions;
          create extension if not exists pg_trgm with schema extensions;
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key, email text);
          create or replace function auth.uid() returns uuid language sql stable as $$
            select nullif(current_setting('request.jwt.claims', true)::jsonb ->> 'sub','')::uuid
          $$;
          create schema if not exists storage;
          create table if not exists storage.buckets (id text primary key, name text, public boolean default false, file_size_limit bigint, allowed_mime_types text[]);
          create table if not exists storage.objects (id uuid primary key default gen_random_uuid(), bucket_id text, name text, owner uuid, metadata jsonb);
          create or replace function storage.foldername(name text) returns text[] language sql immutable as $$ select string_to_array(name, '/') $$;
          create publication supabase_realtime;
          create role authenticated nologin;
          create role anon nologin;
          grant usage on schema auth, storage to authenticated, anon;
          grant select on storage.objects to authenticated;
          alter table storage.objects enable row level security;
          SQL
      - name: Apply repository schema and policies to isolated DB
        run: |
          npm run db:migrate
          npm run db:policies
      - name: Medicines runtime verifier
        run: npm run db:verify:medicines
      - name: Core DB security verifier
        run: npm run db:verify
      - name: Patient isolation verifier
        run: npm run db:verify:patients
      - name: History isolation verifier
        run: npm run db:verify:history
      - name: Migration verifier
        run: npm run db:verify:migrations
