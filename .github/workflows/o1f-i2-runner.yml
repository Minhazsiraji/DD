name: O1-F-I2 runner

on:
  push:
    branches:
      - o1/f-integration-closure-i2

permissions:
  contents: write

jobs:
  run:
    if: github.event.head_commit.message == 'chore(o1-f-i2): runner wrapper'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      START_SHA: 9f75403c948ccf26b9bc644f3f476683d74bb522
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o1/f-integration-closure-i2
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Execute implementation blocks from bootstrap source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          src = Path('.github/workflows/o1f-i2-builder.yml').read_text().splitlines()
          names = [
              'Amend still-unapplied 0047 for F-I2',
              'Narrowly update I1 expectations superseded by I2',
              'Add F-I2 contract verifier',
          ]
          for idx, name in enumerate(names, 1):
              marker = f'      - name: {name}'
              try:
                  start = src.index(marker)
              except ValueError:
                  raise SystemExit(f'missing source step: {name}')
              run_idx = next(i for i in range(start + 1, len(src)) if src[i] == '        run: |')
              end = len(src)
              for i in range(run_idx + 1, len(src)):
                  if src[i].startswith('      - name: ') or src[i].startswith('      - uses: '):
                      end = i
                      break
              body = []
              for line in src[run_idx + 1:end]:
                  body.append(line[10:] if line.startswith('          ') else line)
              script = Path(f'/tmp/o1f_i2_step_{idx}.sh')
              script.write_text('\n'.join(body) + '\n')
              subprocess.run(['bash', '-euo', 'pipefail', str(script)], check=True)
          PY

      - name: Commit and push final candidate
        id: candidate
        run: |
          set -euo pipefail
          rm .github/workflows/o1f-i2-builder.yml .github/workflows/o1f-i2-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(o1-f-i2): close reconciliation runtime races"
          FINAL_SHA=$(git rev-parse HEAD)
          FINAL_BLOB=$(git rev-parse HEAD:supabase/policies/0047_o1_owner_analytics_authority.sql)
          FINAL_SHA256=$(sha256sum supabase/policies/0047_o1_owner_analytics_authority.sql | awk '{print $1}')
          echo "final_sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"
          echo "final_blob=$FINAL_BLOB" >> "$GITHUB_OUTPUT"
          echo "final_sha256=$FINAL_SHA256" >> "$GITHUB_OUTPUT"
          echo "FINAL_SHA=$FINAL_SHA"
          echo "FINAL_0047_BLOB=$FINAL_BLOB"
          echo "FINAL_0047_SHA256=$FINAL_SHA256"
          echo "FINAL_CHANGED_FILES:"
          git diff --name-only "$START_SHA"..HEAD
          git push origin HEAD:o1/f-integration-closure-i2

      - name: Verify exact pushed SHA in clean worktree
        run: |
          set -euo pipefail
          FINAL_SHA='${{ steps.candidate.outputs.final_sha }}'
          FINAL_BLOB='${{ steps.candidate.outputs.final_blob }}'
          git worktree add --detach ../o1f-i2-exact "$FINAL_SHA"
          cd ../o1f-i2-exact
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(git rev-parse HEAD:supabase/policies/0047_o1_owner_analytics_authority.sql)" = "$FINAL_BLOB"
          npm ci
          tests=(
            verify-o1f-activity-day-grain.mjs
            verify-o1f-owner-aal2-and-consent.mjs
            verify-o1f-owner-surface.mjs
            verify-o1f-pilot-plane-isolation.mjs
            verify-o1f-r2-contract.mjs
            verify-o1f-r3-contract.mjs
            verify-o1f-i1-contract.mjs
            verify-o1f-i2-contract.mjs
          )
          i=0
          for test in "${tests[@]}"; do
            i=$((i+1))
            db="o1f_i2_${i}"
            createdb -h localhost -U postgres "$db"
            echo "===== $test :: $db ====="
            DATABASE_URL="postgres://postgres:postgres@localhost:5432/$db" node "scripts/$test"
          done
          echo "POST_HEAD=$(git rev-parse HEAD)"
          echo "POST_BLOB=$(git rev-parse HEAD:supabase/policies/0047_o1_owner_analytics_authority.sql)"
          echo "POST_SHA256=$(sha256sum supabase/policies/0047_o1_owner_analytics_authority.sql | awk '{print $1}')"
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(git rev-parse HEAD:supabase/policies/0047_o1_owner_analytics_authority.sql)" = "$FINAL_BLOB"
          test "$(sha256sum supabase/policies/0047_o1_owner_analytics_authority.sql | awk '{print $1}')" = '${{ steps.candidate.outputs.final_sha256 }}'
          test -z "$(git status --porcelain)"
          test -z "$(git diff --name-only "$START_SHA"..HEAD -- supabase/policies/0041* supabase/policies/0042* supabase/policies/0043* supabase/policies/0044* supabase/policies/0045* supabase/policies/0046*)"
          test -z "$(find supabase/policies -maxdepth 1 -type f -name '0048*' -print)"
