name: INV1-BF-01 Disposable Verification

on:
  push:
    branches:
      - md2/investigation-v1-foundation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inv1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inv1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_inv1_placeholder_key_000000000000
      NEXT_PUBLIC_SITE_URL: https://example.com
      INV1_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/inv1
      PA1_SYNTHETIC_AI_EVAL: disabled

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile
        run: npm ci --ignore-scripts

      - name: Base scope main and frozen proof
        shell: bash
        run: |
          set -euo pipefail
          BASE=9ec7127611dd5576f9591cbd210be8075b8626ee
          EXPECTED_MAIN=5d58f154a8fd18129e28614ccc038f0a6af66b8f
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git hash-object supabase/policies/0041_prescription_correction_window.sql)" = "b89f8759d737afee950567788a715ba9a947f175"
          test "$(git hash-object supabase/policies/0042_m3_prescription_reuse.sql)" = "f0d61c8ba472a57513eb0065a294a2ff65a09b69"
          test "$(git hash-object supabase/policies/0043_m3_signed_medicine_history.sql)" = "16b417bf3117d4e19bb9c52383af5e8608f59a91"
          test "$(git hash-object supabase/policies/0044_m3_prescription_print_audit.sql)" = "139684e77ef6fa2c5414611c32dfd8c6b9113524"
          test "$(git hash-object supabase/policies/0045_prelaunch_sec01b_security_closure.sql)" = "56a606e200a9f6ea43dd33e572511193a17a5f5a"
          test "$(git hash-object src/app/globals.css)" = "9e5d07175e729f142b4cff5574ded5af5a61bdbf"
          test "$(git hash-object src/features/prescriptions/components/print-sheet.tsx)" = "0b8afc336ff27faa0a33eaf22f6a8eac1b236c36"
          echo "INV1_BASE_SCOPE_FROZEN=PASS"

      - name: Focused Investigation backend and disposable DB tests
        run: npx vitest run src/features/encounters/investigation-v1-foundation.test.ts src/features/encounters/investigation-v1-db.test.ts

      - name: Encounter mutation and version regression
        shell: bash
        run: |
          files=$(find src/features/encounters -maxdepth 1 -type f -name '*.test.ts' ! -name 'investigation-v1-db.test.ts' -print)
          test -n "$files"
          INV1_TEST_DATABASE_URL='' npx vitest run $files

      - name: Security authority regression
        run: npx vitest run src/features/security/prelaunch-sec01b.test.ts

      - name: M1 regression
        shell: bash
        run: |
          files=$(find src/features -type f -name '*m1*.test.ts' -print)
          test -n "$files"
          npx vitest run $files

      - name: M2 correction freeze print regression
        shell: bash
        run: |
          files=$(find src/features/prescriptions -type f \( -name '*correction*.test.ts' -o -name '*freeze*.test.ts' -o -name '*print*.test.ts' \) -print)
          test -n "$files"
          npx vitest run $files

      - name: Complete M3 Prescription suite
        shell: bash
        run: |
          files=$(find src/features/prescriptions -type f -name '*.test.ts' -print)
          test -n "$files"
          npx vitest run $files

      - name: PA1 non-live and dictation regression
        shell: bash
        run: |
          ai_tests=$(find src/features/ai -type f -name '*.test.ts' -print)
          voice_tests=$(find src/features/dictation -type f -name '*.test.ts' -print)
          test -n "$ai_tests$voice_tests"
          PA1_SYNTHETIC_AI_EVAL=disabled npx vitest run $ai_tests $voice_tests

      - name: Complete repository tests
        run: INV1_TEST_DATABASE_URL='' PA1_SYNTHETIC_AI_EVAL=disabled npm test

      - name: Generate Next route types
        run: npx next typegen

      - name: Standalone typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/audit-prod.json
          code=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit-prod.json','utf8'));
          const v = audit.metadata?.vulnerabilities ?? {};
          console.log(`INV1_PROD_AUDIT=${JSON.stringify(v)}`);
          if ((v.moderate ?? 0) !== 0 || (v.high ?? 0) !== 0 || (v.critical ?? 0) !== 0) {
            throw new Error(`production dependency gate failed: ${JSON.stringify(v)}`);
          }
          NODE
          echo "INV1_PROD_AUDIT_EXIT=$code"

      - name: Final whitespace and provider boundary proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 9ec7127611dd5576f9591cbd210be8075b8626ee...HEAD
          test -z "${OPENAI_API_KEY:-}"
          test -z "${DEEPGRAM_API_KEY:-}"
          echo "INV1_GIT_DIFF_CHECK=PASS"
          echo "INV1_OPENAI_SECRET_PRESENT=false"
          echo "INV1_DEEPGRAM_SECRET_PRESENT=false"
