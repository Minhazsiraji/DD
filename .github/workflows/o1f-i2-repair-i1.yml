name: O1-F-I2 repair I1 verifier
on:
  push:
    branches: [o1/f-i2-verify-helper-2]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o1/f-integration-closure-i2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair malformed service call
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-o1f-i1-contract.mjs')
          s = p.read_text()
          anchor = 'closed A surface vocabulary rejects unknown'
          start = s.index(anchor)
          pos = s.index('      `;', start)
          s = s[:pos] + '      `);' + s[pos + len('      `;'):]
          p.write_text(s)
          PY
          node --check scripts/verify-o1f-i1-contract.mjs
          node --check scripts/verify-o1f-i2-contract.mjs
      - name: Commit target repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-o1f-i1-contract.mjs
          git commit -m "test(o1-f-i2): repair I1 supersession syntax"
          git push origin HEAD:o1/f-integration-closure-i2
