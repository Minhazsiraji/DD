name: DD Visual Integration QA

on:
  push:
    branches:
      - integration/m3-sec01b-visual-theme
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_dd_visual_integration_placeholder_000000000000
  NEXT_PUBLIC_SITE_URL: https://example.com

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact integration SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile
        run: npm ci --ignore-scripts

      - name: Functional base ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE=0c89abe45f8de38a625b0f56bd82c96a3d45706f
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          echo "FUNCTIONAL_BASE_ANCESTRY=PASS"
          echo "TESTED_SHA=$(git rev-parse HEAD)"

      - name: Exact changed-file classification and functional-delta audit
        shell: bash
        run: |
          set -euo pipefail
          BASE=0c89abe45f8de38a625b0f56bd82c96a3d45706f
          QA=.github/workflows/dd-visual-integration-qa.yml
          git diff --name-only "$BASE" HEAD | grep -v -x "$QA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          src/app/(app)/layout.tsx
          src/app/(app)/settings/appearance/page.tsx
          src/app/(app)/settings/page.tsx
          src/features/settings/background-appearance.test.ts
          src/features/settings/background-preference.ts
          src/features/settings/components/background-appearance.tsx
          src/features/settings/components/background-canvas.tsx
          src/features/settings/components/locked-default-background.module.css
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

          git diff --exit-code "$BASE" HEAD -- \
            'src/app/(app)/dashboard/page.tsx' \
            'src/components/layout/top-bar.tsx' \
            'src/components/layout/desktop-sidebar.tsx' \
            'src/components/common/section-card.tsx' \
            'src/components/marketing/marketing-shell.tsx' \
            'src/app/(auth)' \
            'src/features/appointments' \
            'src/features/encounters' \
            'src/features/patients' \
            'src/features/prescriptions' \
            'src/features/queue' \
            'src/features/owner' \
            'src/features/security' \
            'src/lib' \
            'supabase'

          python - <<'PY'
          import subprocess, pathlib
          base='0c89abe45f8de38a625b0f56bd82c96a3d45706f'
          p='src/app/(app)/layout.tsx'
          old=subprocess.check_output(['git','show',f'{base}:{p}'], text=True)
          cur=pathlib.Path(p).read_text()
          cur=cur.replace('import { BackgroundCanvas } from "@/features/settings/components/background-canvas";\n','')
          cur=cur.replace('      <BackgroundCanvas />\n','')
          if cur != old:
              raise SystemExit('authenticated layout contains non-personalization delta')

          p='src/app/(app)/settings/page.tsx'
          old=subprocess.check_output(['git','show',f'{base}:{p}'], text=True)
          cur=pathlib.Path(p).read_text()
          cur=cur.replace('  Palette,\n','')
          start=cur.index('      <SectionCard className="overflow-hidden">\n        <SectionHeader title="Appearance"')
          end=cur.index('      <SectionCard className="overflow-hidden">\n        <SectionHeader\n          title="Account security"', start)
          cur=cur[:start]+cur[end:]
          if cur.rstrip() != old.rstrip():
              raise SystemExit('settings page contains non-personalization delta')
          PY

          echo "CHANGED_FILES=8"
          echo "PRESENTATION_ONLY=0"
          echo "PERSONALIZATION_FEATURE=8"
          echo "UNEXPECTED_FUNCTIONAL_DELTA=0"

      - name: Donor personalization blob identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 'src/app/(app)/settings/appearance/page.tsx')" = "59c4ea61a9f5272b5d10e6be5400386daae99ef1"
          test "$(git hash-object 'src/features/settings/background-preference.ts')" = "09eaed9f5c6410d2ebefdf4a7184b70a6f2cc3cc"
          test "$(git hash-object 'src/features/settings/background-appearance.test.ts')" = "7f1ac2608228da21a655c6639b1bb93104e514f5"
          test "$(git hash-object 'src/features/settings/components/background-appearance.tsx')" = "ad08d01d82a0b689022d429ba287a09e015122d9"
          test "$(git hash-object 'src/features/settings/components/background-canvas.tsx')" = "6343c0c074cf906ea3829f5a3b12fe9ff85e42ab"
          test "$(git hash-object 'src/features/settings/components/locked-default-background.module.css')" = "9d6f42cdf0c8cfb55ff6b1dd3419f60d89b54e66"
          echo "PERSONALIZATION_DONOR_BLOBS=PASS"

      - name: Trusted theme and security blobs remain exact
        shell: bash
        run: |
          set -euo pipefail
          BASE=0c89abe45f8de38a625b0f56bd82c96a3d45706f
          for p in \
            src/app/globals.css \
            src/app/branding-logo.css \
            src/app/canonical-brand.css \
            src/app/global-background-test.css \
            src/app/app-unified-liquid.css \
            src/app/dd-material-system.css \
            public/dd-global-bg.webp \
            supabase/policies/0041_prescription_correction_window.sql \
            supabase/policies/0042_m3_prescription_reuse.sql \
            supabase/policies/0043_m3_signed_medicine_history.sql \
            supabase/policies/0044_m3_prescription_print_audit.sql \
            supabase/policies/0045_prelaunch_sec01b_security_closure.sql \
            src/features/prescriptions/components/print-sheet.tsx \
            vercel.json; do
            test "$(git hash-object "$p")" = "$(git rev-parse "$BASE:$p")"
          done
          test "$(git hash-object supabase/policies/0041_prescription_correction_window.sql)" = "b89f8759d737afee950567788a715ba9a947f175"
          test "$(git hash-object supabase/policies/0042_m3_prescription_reuse.sql)" = "f0d61c8ba472a57513eb0065a294a2ff65a09b69"
          test "$(git hash-object supabase/policies/0043_m3_signed_medicine_history.sql)" = "16b417bf3117d4e19bb9c52383af5e8608f59a91"
          test "$(git hash-object supabase/policies/0044_m3_prescription_print_audit.sql)" = "139684e77ef6fa2c5414611c32dfd8c6b9113524"
          test "$(git hash-object supabase/policies/0045_prelaunch_sec01b_security_closure.sql)" = "56a606e200a9f6ea43dd33e572511193a17a5f5a"
          grep -Fq '"regions": ["icn1"]' vercel.json
          grep -Fq '@media print' src/app/global-background-test.css
          grep -Fq 'background: #fff !important' src/app/global-background-test.css
          echo "THEME_SECURITY_PRINT_REGION_LOCKS=PASS"

      - name: M1 focused tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find src/features/dashboard src/features/patients -type f -name '*.test.ts' | sort)
          test ${#files[@]} -gt 0
          npx vitest run "${files[@]}"

      - name: M2 focused tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find src/features/encounters src/features/consultation -type f -name '*.test.ts' 2>/dev/null | sort)
          test ${#files[@]} -gt 0
          npx vitest run "${files[@]}"

      - name: M3 full focused tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find src/features/prescriptions -type f -name '*.test.ts' | sort)
          test ${#files[@]} -gt 0
          npx vitest run "${files[@]}"

      - name: SEC-01B mechanics and tests
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run src/features/security/prelaunch-sec01b.test.ts
          node scripts/verify-prelaunch-sec01b-sql.mjs

      - name: Background and personalization tests
        run: npx vitest run src/features/settings/background-appearance.test.ts

      - name: Full repository tests
        run: npm test

      - name: Next route type generation
        run: npx next typegen

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Git diff check
        run: git diff --check 0c89abe45f8de38a625b0f56bd82c96a3d45706f HEAD
