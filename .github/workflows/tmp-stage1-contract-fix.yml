name: Temporary Stage 1 Contract Fix

on:
  push:
    branches:
      - pilot/signature-clinic-logo

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/signature-clinic-logo
      - name: Update v5/v6 fail-closed contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/features/prescriptions/renderer-version.test.ts')
          s = p.read_text()
          replacements = [
              ('it("4 prints through the v4 document", () => {\n    const choice = selectRenderer(4);\n    expect(choice.ok).toBe(true);\n    if (choice.ok) expect(choice.renderer).toBe("v4-modular");\n  });',
               'it("4 and 5 print through the v4 modular document", () => {\n    for (const v of [4, 5]) {\n      const choice = selectRenderer(v);\n      expect(choice.ok).toBe(true);\n      if (choice.ok) expect(choice.renderer).toBe("v4-modular");\n    }\n  });'),
              ('`version >= 4 ? v4 : v3` passes every other assertion here and fails this\n   * one. A v5 bundle carries something v4 never had; handing it to the v4\n   * renderer prints a shorter prescription than the one that was approved, with\n   * nothing on screen to say so.\n   */\n  it("5 is UNSUPPORTED, not \'close enough to 4\'", () => {\n    const choice = selectRenderer(5);\n    expect(choice.ok).toBe(false);\n    if (!choice.ok) {\n      expect(choice.reason).toBe("unsupported-schema");\n      expect(choice.found).toBe(5);\n    }\n  });',
               '`version >= 4 ? v4 : v3` still fails this control. V5 is explicitly\n   * mapped because its new clinic-logo identity is rendered by shared document chrome;\n   * the NEXT unknown version must still fail closed rather than inherit that mapping.\n   */\n  it("6 is UNSUPPORTED, not \'close enough to 5\'", () => {\n    const choice = selectRenderer(6);\n    expect(choice.ok).toBe(false);\n    if (!choice.ok) {\n      expect(choice.reason).toBe("unsupported-schema");\n      expect(choice.found).toBe(6);\n    }\n  });'),
              ('for (const v of ["4", 4.5, NaN, Infinity, null, undefined, {}, [4]]) {',
               'for (const v of ["5", 5.5, NaN, Infinity, null, undefined, {}, [5]]) {'),
              ('const render = toPrescriptionView({ ...v3Bundle, schemaVersion: 5 } as never);\n    expect(render.ok).toBe(false);\n    if (!render.ok) expect(render.found).toBe(5);',
               'const render = toPrescriptionView({ ...v3Bundle, schemaVersion: 6 } as never);\n    expect(render.ok).toBe(false);\n    if (!render.ok) expect(render.found).toBe(6);'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'renderer-version expected block not found: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/features/prescriptions/review-bundle.test.ts')
          s = p.read_text()
          old = '''   * 5, because 4 is now a version this build writes — it replaced the two fixed
   * sections with the doctor's own modules. The guarantee is unchanged and is
   * about the NEXT unknown version: a bundle from a newer server may carry a
   * printable field this build knows nothing about, and rendering it would show
   * the doctor less than the digest they are approving covers.
   *
   * 5 in particular is the one that must NOT be waved through as "close enough
   * to 4" — see `renderer-version.ts`.
   */
  it("fails closed on a schema version from a newer build", () => {
    const parsed = parseReview(envelope({ bundle: { schemaVersion: 5 } }));
    expect(parsed.ok).toBe(false);
    if (!parsed.ok) {
      expect(parsed.reason).toBe("unsupported-schema");
      if (parsed.reason === "unsupported-schema") expect(parsed.found).toBe(5);
    }
  });'''
          new = '''   * 6, because 5 is now a version this build writes — it adds an immutable
   * clinic-logo identity while keeping the accepted modular renderer. The guarantee
   * is unchanged and is about the NEXT unknown version: a newer server may carry a
   * printable field this build knows nothing about, and rendering it would show the
   * doctor less than the digest they are approving covers.
   */
  it("fails closed on a schema version from a newer build", () => {
    const parsed = parseReview(envelope({ bundle: { schemaVersion: 6 } }));
    expect(parsed.ok).toBe(false);
    if (!parsed.ok) {
      expect(parsed.reason).toBe("unsupported-schema");
      if (parsed.reason === "unsupported-schema") expect(parsed.found).toBe(6);
    }
  });'''
          if old not in s:
              raise SystemExit('review-bundle newer-version block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-stage1-contract-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/prescriptions/renderer-version.test.ts src/features/prescriptions/review-bundle.test.ts .github/workflows/tmp-stage1-contract-fix.yml
          git commit -m 'Test: align Stage 1 v5 renderer and v6 refusal contracts'
          git push origin HEAD:pilot/signature-clinic-logo
