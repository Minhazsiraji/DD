name: INV1 CSU QA

on:
  push:
    branches:
      - ui/investigation-v1

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: d27cb7862c9de593ad7e3bddca241d24a4f02bba
      LOCKED_MAIN_SHA: 5d58f154a8fd18129e28614ccc038f0a6af66b8f
      OPENAI_API_KEY: ""
      DEEPGRAM_API_KEY: ""
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply narrow Investigation result-holder type fix once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/encounters/components/investigation-panel.tsx')
          s = p.read_text()
          old_decl = '    let backendResult: InvestigationConfirmationResult | null = null;'
          new_decl = '    const backendBox: { value: InvestigationConfirmationResult | null } = { value: null };'
          if old_decl in s:
              if s.count(old_decl) != 2:
                  raise SystemExit(f'unexpected backendResult declaration count: {s.count(old_decl)}')
              s = s.replace(old_decl, new_decl)
              s = s.replace('        backendResult = await confirmInvestigationsAction({', '        backendBox.value = await confirmInvestigationsAction({')
              s = s.replace('        return toListResult(backendResult);', '        return toListResult(backendBox.value);')
              first_guard = '    );\n\n    if (!listResult || !backendResult || expectedVersion === null) {'
              s = s.replace(
                  first_guard,
                  '    );\n    const backendResult = backendBox.value as InvestigationConfirmationResult | null;\n\n    if (!listResult || !backendResult || expectedVersion === null) {',
                  1,
              )
              second_guard = '    );\n\n    if (!listResult || !backendResult) {'
              s = s.replace(
                  second_guard,
                  '    );\n    const backendResult = backendBox.value as InvestigationConfirmationResult | null;\n\n    if (!listResult || !backendResult) {',
                  1,
              )
              p.write_text(s)
          elif s.count('const backendBox: { value: InvestigationConfirmationResult | null }') != 2:
              raise SystemExit('panel is neither the expected pre-fix nor post-fix shape')
          PY

          if git diff --quiet -- src/features/encounters/components/investigation-panel.tsx; then
            echo 'Type-safe result-holder patch already present.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/features/encounters/components/investigation-panel.tsx
            git commit -m 'fix(inv1): preserve typed batch confirmation result'
            git push origin HEAD:ui/investigation-v1
            echo 'Pushed narrow product fix; stopping stale-SHA QA run so the new SHA is tested.'
            exit 1
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: INV1 scope and frozen-integrity guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$LOCKED_MAIN_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"

          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD | grep -v '^\.github/workflows/inv1-csu-qa\.yml$' | sort)
          expected=(
            'src/features/encounters/components/consultation-workspace.tsx'
            'src/features/encounters/components/investigation-panel.tsx'
            'src/features/encounters/investigation-v1-read-actions.ts'
            'src/features/encounters/investigation-v1-ui.test.ts'
            'src/features/encounters/investigation-v1-ui.ts'
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

          if printf '%s\n' "${changed[@]}" | grep -E '(^|/)(supabase|db|migrations?|schema)(/|$)|\.sql$'; then
            echo 'Unauthorized database/schema/migration delta detected.' >&2
            exit 1
          fi

          check_hash() {
            local path="$1"
            local expected_sha="$2"
            local actual
            actual="$(git hash-object "$path")"
            echo "$path $actual"
            test "$actual" = "$expected_sha"
          }

          check_hash supabase/policies/0041_prescription_correction_window.sql b89f8759d737afee950567788a715ba9a947f175
          check_hash supabase/policies/0042_m3_prescription_reuse.sql f0d61c8ba472a57513eb0065a294a2ff65a09b69
          check_hash supabase/policies/0043_m3_signed_medicine_history.sql 16b417bf3117d4e19bb9c52383af5e8608f59a91
          check_hash supabase/policies/0044_m3_prescription_print_audit.sql 139684e77ef6fa2c5414611c32dfd8c6b9113524
          check_hash supabase/policies/0045_prelaunch_sec01b_security_closure.sql 56a606e200a9f6ea43dd33e572511193a17a5f5a
          check_hash supabase/policies/0046_investigation_v1_foundation.sql 5e105f3015f1251279e3ba94b5c3b745998b8e22
          check_hash src/app/globals.css 9e5d07175e729f142b4cff5574ded5af5a61bdbf
          check_hash src/features/prescriptions/components/print-sheet.tsx 0b8afc336ff27faa0a33eaf22f6a8eac1b236c36

          node -e 'const v=require("./vercel.json"); if(JSON.stringify(v.regions)!==JSON.stringify(["icn1"])) process.exit(1)'

          if grep -Ein 'openai|deepgram' \
            src/features/encounters/components/consultation-workspace.tsx \
            src/features/encounters/components/investigation-panel.tsx \
            src/features/encounters/investigation-v1-read-actions.ts \
            src/features/encounters/investigation-v1-ui.ts; then
            echo 'Live provider reference detected in INV1 runtime delta.' >&2
            exit 1
          fi

      - name: Focused INV1 CSU tests
        run: >-
          npx vitest run
          src/features/encounters/investigation-v1-ui.test.ts
          src/features/encounters/investigation-v1-foundation.test.ts
          src/features/encounters/investigation-v1-db.test.ts

      - name: Encounter and M2 workspace regression
        run: >-
          npx vitest run
          src/features/encounters/m2-consultation-workspace.test.ts
          src/features/encounters/m2-responsive-widths.test.ts
          src/features/encounters/m2-uat-corrections.test.ts
          src/features/encounters/mutation-gate.test.ts
          src/features/encounters/desync-outcomes.test.ts
          src/features/encounters/finding-conflict.test.ts
          src/features/encounters/removal-conflict.test.ts

      - name: M1 regression
        run: >-
          npx vitest run
          src/features/patients/m1-implementation.test.ts
          src/features/dashboard/m1-dashboard-performance.test.ts

      - name: Complete M3 Prescription regression
        run: npx vitest run src/features/prescriptions

      - name: PA1 non-live regression
        run: >-
          npx vitest run
          src/features/ai/pa1-foundation.test.ts
          src/features/ai/pa1-integrity.test.ts
          src/features/ai/pa1-voice-security.test.ts

      - name: Complete repository tests
        run: npm test

      - name: Next route type generation
        run: npx next typegen

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const v = report.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify(v));
          for (const level of ['moderate', 'high', 'critical']) {
            if ((v[level] ?? 0) !== 0) {
              console.error(`Production dependency audit failed: ${level}=${v[level]}`);
              process.exit(1);
            }
          }
          NODE

      - name: Diff whitespace check
        run: git diff --check "$BASE_SHA"...HEAD
