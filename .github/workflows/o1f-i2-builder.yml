      - name: Commit final candidate and remove bootstrap workflow
        id: candidate
        run: |
          set -euo pipefail
          rm .github/workflows/o1f-i2-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(o1-f-i2): close reconciliation runtime races"
          FINAL_SHA=$(git rev-parse HEAD)
          FINAL_BLOB=$(git rev-parse HEAD:supabase/policies/0047_o1_owner_analytics_authority.sql)
          FINAL_SHA256=$(sha256sum supabase/policies/0047_o1_owner_analytics_authority.sql | awk '{print $1}')
          echo "final_sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"
          echo "final_blob=$FINAL_BLOB" >> "$GITHUB_OUTPUT"
          echo "final_sha256=$FINAL_SHA256" >> "$GITHUB_OUTPUT"
          echo "FINAL_SHA=$FINAL_SHA"
          echo "FINAL_0047_BLOB=$FINAL_BLOB"
          echo "FINAL_0047_SHA256=$FINAL_SHA256"
          echo "CHANGED_FILES_START_TO_FINAL:"
          git diff --name-only "$START_SHA"..HEAD
          git push origin HEAD:o1/f-integration-closure-i2

      - name: Create clean exact-SHA worktree
        run: |
          set -euo pipefail
          FINAL_SHA='${{ steps.candidate.outputs.final_sha }}'
          git worktree add --detach ../o1f-i2-exact "$FINAL_SHA"
          cd ../o1f-i2-exact
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(git rev-parse HEAD:supabase/policies/0047_o1_owner_analytics_authority.sql)" = '${{ steps.candidate.outputs.final_blob }}'
          npm ci

      - name: Run all eight F verifiers on fresh disposable PostgreSQL databases
        run: |
          set -euo pipefail
          cd ../o1f-i2-exact
          tests=(
            verify-o1f-activity-day-grain.mjs
            verify-o1f-owner-aal2-and-consent.mjs
            verify-o1f-owner-surface.mjs
            verify-o1f-pilot-plane-isolation.mjs
            verify-o1f-r2-contract.mjs
            verify-o1f-r3-contract.mjs
            verify-o1f-i1-contract.mjs
            verify-o1f-i2-contract.mjs
          )
          i=0
          for test in "${tests[@]}"; do
            i=$((i+1))
            db="o1f_i2_${i}"
            createdb -h localhost -U postgres "$db"
            echo "===== $test :: $db ====="
            DATABASE_URL="postgres://postgres:postgres@localhost:5432/$db" node "scripts/$test"
          done

      - name: Reconfirm exact SHA, clean worktree, blob and migration scope
        run: |
          set -euo pipefail
          cd ../o1f-i2-exact
          FINAL_SHA='${{ steps.candidate.outputs.final_sha }}'
          FINAL_BLOB='${{ steps.candidate.outputs.final_blob }}'
          FINAL_SHA256='${{ steps.candidate.outputs.final_sha256 }}'
          echo "POST_HEAD=$(git rev-parse HEAD)"
          echo "POST_BLOB=$(git rev-parse HEAD:supabase/policies/0047_o1_owner_analytics_authority.sql)"
          echo "POST_SHA256=$(sha256sum supabase/policies/0047_o1_owner_analytics_authority.sql | awk '{print $1}')"
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(git rev-parse HEAD:supabase/policies/0047_o1_owner_analytics_authority.sql)" = "$FINAL_BLOB"
          test "$(sha256sum supabase/policies/0047_o1_owner_analytics_authority.sql | awk '{print $1}')" = "$FINAL_SHA256"
          test -z "$(git status --porcelain)"
          test -z "$(git diff --name-only "$START_SHA"..HEAD -- supabase/policies/0041* supabase/policies/0042* supabase/policies/0043* supabase/policies/0044* supabase/policies/0045* supabase/policies/0046*)"
          test -z "$(find supabase/policies -maxdepth 1 -type f -name '0048*' -print)"
          echo "FINAL_CHANGED_FILES:"
          git diff --name-only "$START_SHA"..HEAD
