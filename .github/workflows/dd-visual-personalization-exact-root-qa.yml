name: DD Visual Personalization Exact Root QA

on:
  push:
    branches:
      - md2/dd-visual-personalization-01-r2-background-lock

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    env:
      CORRECTION_BASE_SHA: 756bbad88ae6716e24fb88586460550b9fde42b3
      OPENAI_API_KEY: ""
      DEEPGRAM_API_KEY: ""
      PA1_SYNTHETIC_AI_EVAL: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact root-background correction scope guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$CORRECTION_BASE_SHA" HEAD)" = "$CORRECTION_BASE_SHA"
          changed="$(git diff --name-only "$CORRECTION_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/dd-visual-personalization-exact-root-qa.yml|\
              src/app/global-background-test.css|\
              src/app/layout.tsx|\
              src/features/settings/background-appearance.test.ts|\
              src/features/settings/components/background-canvas.tsx|\
              src/features/settings/components/locked-default-background.module.css)
                ;;
              "") ;;
              *) echo "Unexpected correction file: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          test "$(git rev-parse HEAD:src/app/global-background-test.css)" = "062f35853c07cf72e7f6d6438878a2e9f4ff6b79"
          test "$(git rev-parse HEAD:public/dd-global-bg.webp)" = "e50c9e62d3340206d18724784a94a9a295c3851c"
          test "$(git rev-parse HEAD:src/app/globals.css)" = "9e5d07175e729f142b4cff5574ded5af5a61bdbf"
          grep -F 'import "./global-background-test.css";' src/app/layout.tsx
          if printf '%s\n' "$changed" | grep -E '(^|/)(supabase|migrations|policies)(/|$)|\.sql$'; then
            echo "Protected DB/schema surface changed" >&2
            exit 1
          fi
      - name: Install
        run: npm ci
      - name: Appearance exact-match focused tests
        run: npx vitest run src/features/settings/background-appearance.test.ts
      - name: Full repository tests
        run: npm test
      - name: Next type generation
        run: npx next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check "$CORRECTION_BASE_SHA"...HEAD
