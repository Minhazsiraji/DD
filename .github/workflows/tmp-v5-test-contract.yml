name: Temporary V5 Test Contract Update

on:
  push:
    branches:
      - pilot/signature-clinic-logo

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/signature-clinic-logo
      - name: Update exact schema-version expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/prescriptions/prescription-renderers.test.ts')
          s = p.read_text()
          old1 = 'expect([...SUPPORTED_BUNDLE_SCHEMA_VERSIONS]).toEqual([2, 3, 4]);'
          new1 = 'expect([...SUPPORTED_BUNDLE_SCHEMA_VERSIONS]).toEqual([2, 3, 4, 5]);'
          old2 = 'expect(CURRENT_BUNDLE_SCHEMA_VERSION).toBe(4);'
          new2 = 'expect(CURRENT_BUNDLE_SCHEMA_VERSION).toBe(5);'
          if old1 not in s or old2 not in s:
              raise SystemExit('expected stale v4 assertions not found')
          p.write_text(s.replace(old1, new1).replace(old2, new2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/prescriptions/prescription-renderers.test.ts
          git commit -m 'Test: accept immutable clinic logo bundle schema v5'
          git push origin HEAD:pilot/signature-clinic-logo
