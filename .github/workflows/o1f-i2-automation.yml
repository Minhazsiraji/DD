import { execFileSync } from "node:child_process";
import { readdirSync } from "node:fs";
import {
  applyFileIdempotent,
  createProfile,
  readMigrationFile,
} from "./o1f-test-support.mjs";

const START_SHA = "9f75403c948ccf26b9bc644f3f476683d74bb522";
const url = process.env.DIRECT_URL ?? process.env.DATABASE_URL;
if (!url) {
  console.error("DIRECT_URL or DATABASE_URL must be set.");
  process.exit(1);
}

const FILES = [
  "drizzle/migrations/0000_parallel_mentor.sql",
  "drizzle/migrations/0019_open_whizzer.sql",
  "supabase/policies/0033_platform_owner_authority.sql",
  "supabase/policies/0045_prelaunch_sec01b_security_closure.sql",
  "supabase/policies/0047_o1_owner_analytics_authority.sql",
];

let failures = 0;
function check(ok, label, detail = "") {
  console.log(`  ${ok ? "✓" : "✗"} ${label}${detail ? ` — ${detail}` : ""}`);
  if (!ok) failures += 1;
}
function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

async function asRole(tx, role, fn) {
  await tx`select set_config('role', ${role}, true)`;
  try { return await fn(tx); }
  finally { await tx`select set_config('role', null, true)`; }
}
async function service(tx, fn) { return asRole(tx, "service_role", fn); }
async function asAuthenticated(tx, userId, aal, fn) {
  await tx`select set_config(
    'request.jwt.claims',
    ${JSON.stringify({ sub: userId, role: "authenticated", aal })},
    true
  )`;
  await tx`select set_config('role', 'authenticated', true)`;
  try { return await fn(tx); }
  finally {
    await tx`select set_config('role', null, true)`;
    await tx`select set_config('request.jwt.claims', null, true)`;
  }
}
async function expectRefused(tx, label, expected, fn) {
  try {
    await tx.savepoint(async (sp) => {
      await fn(sp);
      throw new Error("__ALLOWED__");
    });
    check(false, label, "ALLOWED");
  } catch (error) {
    if (error.message === "__ALLOWED__") {
      check(false, label, "ALLOWED");
      return;
    }
    check(String(error.message).includes(expected), label, String(error.message).split("\n")[0]);
  }
}

async function createEnrolledParticipant(tx, ownerId, cohortCode, targetDay, n) {
  const profileId = await createProfile(tx, `QA I2 Doctor ${cohortCode} ${n} @qa.invalid`);
  const [doctor] = await tx`
    insert into doctor_profiles(user_id) values (${profileId}) returning id
  `;
  const [p] = await tx`
    insert into pilot_participations(cohort_code, doctor_id, status, enrolled_on)
    values (${cohortCode}, ${doctor.id}, 'INVITED', ${targetDay}::date)
    returning participation_id
  `;
  await tx`
    insert into pilot_status_events(
      participation_id, cohort_code, event_code, event_day, recorded_by
    ) values (
      ${p.participation_id}, ${cohortCode}, 'INVITED', ${targetDay}::date, ${ownerId}
    )
  `;
  await tx`update pilot_participations set status = 'ENROLLED' where participation_id = ${p.participation_id}`;
  await tx`
    insert into pilot_status_events(
      participation_id, cohort_code, event_code, event_day, recorded_by
    ) values (
      ${p.participation_id}, ${cohortCode}, 'ENROLLED', ${targetDay}::date, ${ownerId}
    )
  `;
  await tx`
    insert into pilot_consent_events(
      participation_id, cohort_code, consent_scope, consent_version,
      event, effective_at, recorded_by
    ) values (
      ${p.participation_id}, ${cohortCode}, 'PRODUCT_USAGE_ANALYTICS', 'v1',
      'CONSENT_GRANTED', ${targetDay}::date::timestamptz, ${ownerId}
    )
  `;
  return { profileId, doctorId: doctor.id, participationId: p.participation_id };
}

async function readAllMinutes(tx, doctorId, day, generation, pageSize = 1) {
  const rows = [];
  let afterMinute = null;
  let afterSurface = null;
  while (true) {
    const page = await service(tx, (sp) => sp`
      select * from public.read_engagement_minute_page(
        ${doctorId}, ${day}::date, ${generation},
        ${afterMinute}::timestamptz, ${afterSurface}::text, ${pageSize}
      )
    `);
    rows.push(...page);
    if (page.length < pageSize) break;
    const last = page[page.length - 1];
    afterMinute = last.minute_bucket;
    afterSurface = last.surface;
  }
  return rows;
}

async function reconcile(tx, doctorId, day, expectedCount = null) {
  const [opened] = await service(tx, (sp) => sp`
    select * from public.open_activity_reconciliation(${doctorId}, ${day}::date)
  `);
  const generation = Number(opened.evidence_generation);
  const rows = await readAllMinutes(tx, doctorId, day, generation, 1);
  check(rows.length === Number(opened.evidence_count), "paged replay exhausts authoritative evidence");
  if (expectedCount !== null) check(rows.length === expectedCount, `expected evidence count ${expectedCount}`);
  await service(tx, (sp) => sp`
    select public.ack_activity_reconciliation(
      ${doctorId}, ${day}::date, ${generation}, ${rows.length}
    )
  `);
  return { opened, generation, rows };
}

