name: O1-F-I2 disposable implementation + exact SHA verification

on:
  push:
    branches:
      - o1/f-i2-automation

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout authorized F-I2 lane
        uses: actions/checkout@v4
        with:
          ref: o1/f-integration-closure-i2
          fetch-depth: 0

      - name: Assert frozen starting authority
        shell: bash
        run: |
          set -euo pipefail
          START=9f75403c948ccf26b9bc644f3f476683d74bb522
          test "$(git rev-parse HEAD)" = "$START"
          test "$(git hash-object supabase/policies/0047_o1_owner_analytics_authority.sql)" = "9c74aea5dcab2b83b1ca384eaad9eaf1ac1194ea"
          test -z "$(git status --porcelain)"
          echo "F_I2_START_SHA=$START"

      - name: Append centrally authorized F-I2 SQL closure
        shell: bash
        run: |
          set -euo pipefail
          cat >> supabase/policies/0047_o1_owner_analytics_authority.sql <<'SQL'

-- ============================================================================
-- O1-F-I2 — Final runtime closure contract
-- CENTRAL-authorized amendment to the still-unapplied 0047 only.
-- No A metric arithmetic is implemented here. This block supplies only
-- trusted minute persistence, reconciliation evidence, timezone continuity,
-- generation/dirty-state authority, serialization, and actor->Doctor lookup.
-- ============================================================================

-- Minimal Doctor/day replay state. time_zone is the exact IANA zone supplied by
-- the trusted server context that assigned this Doctor/day. No practice/location
-- identifier, route, device, patient, encounter, payload or clinical field is
-- persisted. A conflicting zone for one Doctor/day fails closed.
create table public.activity_reconciliation_state (
  doctor_id uuid not null references public.doctor_profiles(id),
  period_day date not null,
  time_zone text not null check (char_length(time_zone) between 1 and 80),
  evidence_generation bigint not null default 0 check (evidence_generation >= 0),
  reconciled_generation bigint check (
    reconciled_generation is null
    or (reconciled_generation >= 0 and reconciled_generation <= evidence_generation)
  ),
  reconciled_at timestamptz,
  primary key (doctor_id, period_day),
  check (
    (reconciled_generation is null and reconciled_at is null)
    or
    (reconciled_generation is not null and reconciled_at is not null)
  )
);

alter table public.activity_reconciliation_state enable row level security;
alter table public.activity_reconciliation_state force row level security;
create policy activity_reconciliation_state_deny_default
  on public.activity_reconciliation_state for all
  using (false) with check (false);
create policy activity_reconciliation_state_rollup_all
  on public.activity_reconciliation_state for all to dd_metrics_rollup
  using (true) with check (true);

revoke all on public.activity_reconciliation_state
  from public, anon, authenticated, service_role,
       dd_metrics_reader, dd_metrics_rollup, dd_pilot_writer, dd_retention;
grant select, insert, update on public.activity_reconciliation_state
  to dd_metrics_rollup;

-- The canonical actor ownership relation is doctor_profiles.user_id. 0000 has
-- a structural unique index on that column; this internal role receives only
-- the two columns required to resolve that ownership edge. API roles receive no
-- direct Doctor-profile table privilege.
grant select (id, user_id) on public.doctor_profiles to dd_metrics_rollup;
create policy doctor_profiles_o1f_actor_resolver_read
  on public.doctor_profiles for select to dd_metrics_rollup
  using (true);

create or replace function public.resolve_doctor_profile_id(
  target_actor_user_id uuid
) returns uuid
language plpgsql
stable
security definer
set search_path = public, pg_temp
as $$
declare
  v_doctor_id uuid;
begin
  if target_actor_user_id is null then
    return null;
  end if;

  begin
    select d.id
    into strict v_doctor_id
    from public.doctor_profiles d
    where d.user_id = target_actor_user_id;
  exception
    when no_data_found then
      return null;
    when too_many_rows then
      raise exception 'O1F_ACTOR_DOCTOR_RESOLUTION_AMBIGUOUS' using errcode = '21000';
  end;

  return v_doctor_id;
end;
$$;
alter function public.resolve_doctor_profile_id(uuid)
  owner to dd_metrics_rollup;

create or replace function public.register_activity_reconciliation_day(
  target_doctor_id uuid,
  target_period_day date,
  target_time_zone text
) returns bigint
language plpgsql
security definer
set search_path = public, pg_temp
as $$
declare
  v_existing_zone text;
  v_generation bigint;
  v_local_today date;
begin
  if target_doctor_id is null or target_period_day is null or target_time_zone is null then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_CONTEXT_REQUIRED' using errcode = '22023';
  end if;

  if not exists (
    select 1
    from pg_catalog.pg_timezone_names z
    where z.name = target_time_zone
  ) then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_TIMEZONE_INVALID' using errcode = '22023';
  end if;

  v_local_today := (clock_timestamp() at time zone target_time_zone)::date;
  if target_period_day < v_local_today - 1 or target_period_day > v_local_today then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_DAY_OUT_OF_RANGE' using errcode = '22023';
  end if;

  perform pg_catalog.pg_advisory_xact_lock(
    pg_catalog.hashtextextended('dd:o1f:activity-day:' || target_period_day::text, 0)
  );

  insert into public.activity_reconciliation_state(
    doctor_id, period_day, time_zone, evidence_generation
  ) values (
    target_doctor_id, target_period_day, target_time_zone, 0
  )
  on conflict (doctor_id, period_day) do nothing;

  select s.time_zone, s.evidence_generation
  into v_existing_zone, v_generation
  from public.activity_reconciliation_state s
  where s.doctor_id = target_doctor_id
    and s.period_day = target_period_day
  for update;

  if v_existing_zone is distinct from target_time_zone then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_TIMEZONE_CONFLICT' using errcode = '22023';
  end if;

  return v_generation;
end;
$$;
alter function public.register_activity_reconciliation_day(uuid, date, text)
  owner to dd_metrics_rollup;

-- I2 supersedes I1's DB-clock writer. The trusted server supplies its minute
-- stamp and exact clinic timezone. PostgreSQL truncates that trusted stamp to
-- the minute, validates bounded freshness/future skew, and verifies that the
-- supplied period_day is exactly the clinic-local date for that stamp.
revoke execute on function public.record_engagement_minute(uuid, date, text)
  from public, anon, authenticated, service_role,
       dd_metrics_reader, dd_metrics_rollup, dd_pilot_writer, dd_retention;
drop function public.record_engagement_minute(uuid, date, text);

create or replace function public.record_engagement_minute(
  target_doctor_id uuid,
  target_period_day date,
  target_minute_stamp timestamptz,
  target_surface text,
  target_time_zone text
) returns boolean
language plpgsql
security definer
set search_path = public, pg_temp
as $$
declare
  v_now timestamptz := clock_timestamp();
  v_bucket timestamptz;
  v_existing_zone text;
  v_inserted bigint;
begin
  if target_doctor_id is null
     or target_period_day is null
     or target_minute_stamp is null
     or target_time_zone is null
  then
    raise exception 'O1A_MINUTE_CONTEXT_REQUIRED' using errcode = '22023';
  end if;

  if target_surface not in (
    'DASHBOARD',
    'PATIENTS',
    'CONSULTATION',
    'PRESCRIPTION',
    'APPOINTMENTS',
    'QUEUE',
    'SETTINGS',
    'OWNER'
  ) then
    raise exception 'O1A_MINUTE_SURFACE_INVALID' using errcode = '22023';
  end if;

  if not exists (
    select 1
    from pg_catalog.pg_timezone_names z
    where z.name = target_time_zone
  ) then
    raise exception 'O1A_MINUTE_TIMEZONE_INVALID' using errcode = '22023';
  end if;

  if target_minute_stamp < v_now - interval '40 minutes'
     or target_minute_stamp > v_now + interval '2 minutes'
  then
    raise exception 'O1A_MINUTE_TIMESTAMP_OUT_OF_RANGE' using errcode = '22023';
  end if;

  v_bucket := date_trunc('minute', target_minute_stamp);
  if (v_bucket at time zone target_time_zone)::date <> target_period_day then
    raise exception 'O1A_MINUTE_PERIOD_DAY_MISMATCH' using errcode = '22023';
  end if;

  perform pg_catalog.pg_advisory_xact_lock(
    pg_catalog.hashtextextended('dd:o1f:activity-day:' || target_period_day::text, 0)
  );

  insert into public.activity_reconciliation_state(
    doctor_id, period_day, time_zone, evidence_generation
  ) values (
    target_doctor_id, target_period_day, target_time_zone, 0
  )
  on conflict (doctor_id, period_day) do nothing;

  select s.time_zone
  into v_existing_zone
  from public.activity_reconciliation_state s
  where s.doctor_id = target_doctor_id
    and s.period_day = target_period_day
  for update;

  if v_existing_zone is distinct from target_time_zone then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_TIMEZONE_CONFLICT' using errcode = '22023';
  end if;

  delete from public.engagement_minute_store
  where minute_bucket < v_now - interval '48 hours';

  insert into public.engagement_minute_store(
    doctor_id, period_day, minute_bucket, surface
  ) values (
    target_doctor_id, target_period_day, v_bucket, target_surface
  )
  on conflict (doctor_id, period_day, minute_bucket, surface) do nothing;

  get diagnostics v_inserted = row_count;

  if v_inserted = 1 then
    update public.activity_reconciliation_state
    set evidence_generation = evidence_generation + 1,
        reconciled_generation = null,
        reconciled_at = null
    where doctor_id = target_doctor_id
      and period_day = target_period_day;

    -- A unique late minute makes any previous ACTIVITY completeness stale
    -- immediately. The calculation itself remains frozen-A worker authority.
    delete from public.telemetry_day_coverage
    where period_day = target_period_day
      and principal_doctor_id = target_doctor_id
      and measurement_domain = 'ACTIVITY';

    delete from public.doctor_daily_activity_agg
    where period_day = target_period_day
      and doctor_id = target_doctor_id;
  end if;

  return v_inserted = 1;
end;
$$;
alter function public.record_engagement_minute(uuid, date, timestamptz, text, text)
  owner to dd_metrics_rollup;

-- I1's unbounded two-argument snapshot is superseded by generation-bound,
-- bounded keyset paging. No direct table access is exposed to service_role.
revoke execute on function public.snapshot_engagement_minutes(uuid, date)
  from public, anon, authenticated, service_role,
       dd_metrics_reader, dd_metrics_rollup, dd_pilot_writer, dd_retention;
drop function public.snapshot_engagement_minutes(uuid, date);

create or replace function public.discover_activity_reconciliation_doctors(
  target_period_day date,
  target_after_doctor_id uuid default null,
  target_limit integer default 100
) returns table (
  doctor_id uuid,
  time_zone text,
  evidence_generation bigint,
  reconciled_generation bigint
)
language plpgsql
stable
security definer
set search_path = public, pg_temp
as $$
begin
  if target_period_day is null then
    raise exception 'O1F_ACTIVITY_DISCOVERY_DAY_REQUIRED' using errcode = '22023';
  end if;
  if target_limit is null or target_limit < 1 or target_limit > 500 then
    raise exception 'O1F_ACTIVITY_DISCOVERY_LIMIT_INVALID' using errcode = '22023';
  end if;

  return query
  with eligible as (
    select distinct p.doctor_id
    from public.pilot_participations p
    where p.status in ('ENROLLED','COMPLETED')
      and p.enrolled_on <= target_period_day
      and public.pilot_consent_covers_day(
        p.cohort_code,
        p.participation_id,
        'PRODUCT_USAGE_ANALYTICS',
        target_period_day
      )
  )
  select
    e.doctor_id,
    s.time_zone,
    s.evidence_generation,
    s.reconciled_generation
  from eligible e
  left join public.activity_reconciliation_state s
    on s.doctor_id = e.doctor_id
   and s.period_day = target_period_day
  where target_after_doctor_id is null
     or e.doctor_id > target_after_doctor_id
  order by e.doctor_id
  limit target_limit;
end;
$$;
alter function public.discover_activity_reconciliation_doctors(date, uuid, integer)
  owner to dd_metrics_rollup;

create or replace function public.open_activity_reconciliation(
  target_doctor_id uuid,
  target_period_day date
) returns table (
  time_zone text,
  evidence_generation bigint,
  evidence_count bigint
)
language plpgsql
security definer
set search_path = public, pg_temp
as $$
declare
  v_zone text;
  v_generation bigint;
  v_day_start timestamptz;
  v_day_end timestamptz;
begin
  if target_doctor_id is null or target_period_day is null then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_CONTEXT_REQUIRED' using errcode = '22023';
  end if;

  perform pg_catalog.pg_advisory_xact_lock(
    pg_catalog.hashtextextended('dd:o1f:activity-day:' || target_period_day::text, 0)
  );

  select s.time_zone, s.evidence_generation
  into v_zone, v_generation
  from public.activity_reconciliation_state s
  where s.doctor_id = target_doctor_id
    and s.period_day = target_period_day
  for update;

  if not found then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_CONTEXT_MISSING' using errcode = '55000';
  end if;

  v_day_start := target_period_day::timestamp at time zone v_zone;
  v_day_end := (target_period_day + 1)::timestamp at time zone v_zone;

  if clock_timestamp() < v_day_end then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_DAY_OPEN' using errcode = '55000';
  end if;
  if clock_timestamp() - interval '48 hours' >= v_day_start then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_EVIDENCE_EXPIRED' using errcode = '55000';
  end if;

  perform public.purge_expired_engagement_minutes();

  return query
  select
    v_zone,
    v_generation,
    count(*)::bigint
  from public.engagement_minute_store m
  where m.doctor_id = target_doctor_id
    and m.period_day = target_period_day;
end;
$$;
alter function public.open_activity_reconciliation(uuid, date)
  owner to dd_metrics_rollup;

create or replace function public.read_engagement_minute_page(
  target_doctor_id uuid,
  target_period_day date,
  target_expected_generation bigint,
  target_after_minute_bucket timestamptz default null,
  target_after_surface text default null,
  target_limit integer default 500
) returns table (
  minute_bucket timestamptz,
  surface text
)
language plpgsql
security definer
set search_path = public, pg_temp
as $$
declare
  v_generation bigint;
begin
  if target_doctor_id is null
     or target_period_day is null
     or target_expected_generation is null
     or target_expected_generation < 0
  then
    raise exception 'O1F_ACTIVITY_PAGE_CONTEXT_INVALID' using errcode = '22023';
  end if;
  if target_limit is null or target_limit < 1 or target_limit > 1000 then
    raise exception 'O1F_ACTIVITY_PAGE_LIMIT_INVALID' using errcode = '22023';
  end if;
  if (target_after_minute_bucket is null) <> (target_after_surface is null) then
    raise exception 'O1F_ACTIVITY_PAGE_CURSOR_INVALID' using errcode = '22023';
  end if;

  perform pg_catalog.pg_advisory_xact_lock(
    pg_catalog.hashtextextended('dd:o1f:activity-day:' || target_period_day::text, 0)
  );

  select s.evidence_generation
  into v_generation
  from public.activity_reconciliation_state s
  where s.doctor_id = target_doctor_id
    and s.period_day = target_period_day
  for update;

  if not found then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_CONTEXT_MISSING' using errcode = '55000';
  end if;
  if v_generation <> target_expected_generation then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_GENERATION_STALE' using errcode = '40001';
  end if;

  perform public.purge_expired_engagement_minutes();

  return query
  select m.minute_bucket, m.surface
  from public.engagement_minute_store m
  where m.doctor_id = target_doctor_id
    and m.period_day = target_period_day
    and (
      target_after_minute_bucket is null
      or (m.minute_bucket, m.surface) >
         (target_after_minute_bucket, target_after_surface)
    )
  order by m.minute_bucket, m.surface
  limit target_limit;
end;
$$;
alter function public.read_engagement_minute_page(
  uuid, date, bigint, timestamptz, text, integer
) owner to dd_metrics_rollup;

create or replace function public.ack_activity_reconciliation(
  target_doctor_id uuid,
  target_period_day date,
  target_expected_generation bigint,
  target_observed_evidence_count bigint
) returns void
language plpgsql
security definer
set search_path = public, pg_temp
as $$
declare
  v_zone text;
  v_generation bigint;
  v_count bigint;
  v_day_start timestamptz;
  v_day_end timestamptz;
begin
  if target_doctor_id is null
     or target_period_day is null
     or target_expected_generation is null
     or target_expected_generation < 0
     or target_observed_evidence_count is null
     or target_observed_evidence_count < 0
  then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_ACK_INVALID' using errcode = '22023';
  end if;

  perform pg_catalog.pg_advisory_xact_lock(
    pg_catalog.hashtextextended('dd:o1f:activity-day:' || target_period_day::text, 0)
  );

  select s.time_zone, s.evidence_generation
  into v_zone, v_generation
  from public.activity_reconciliation_state s
  where s.doctor_id = target_doctor_id
    and s.period_day = target_period_day
  for update;

  if not found then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_CONTEXT_MISSING' using errcode = '55000';
  end if;
  if v_generation <> target_expected_generation then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_GENERATION_STALE' using errcode = '40001';
  end if;

  v_day_start := target_period_day::timestamp at time zone v_zone;
  v_day_end := (target_period_day + 1)::timestamp at time zone v_zone;
  if clock_timestamp() < v_day_end then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_DAY_OPEN' using errcode = '55000';
  end if;
  if clock_timestamp() - interval '48 hours' >= v_day_start then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_EVIDENCE_EXPIRED' using errcode = '55000';
  end if;

  perform public.purge_expired_engagement_minutes();
  select count(*)::bigint
  into v_count
  from public.engagement_minute_store m
  where m.doctor_id = target_doctor_id
    and m.period_day = target_period_day;

  if v_count <> target_observed_evidence_count then
    raise exception 'O1F_ACTIVITY_RECONCILIATION_EVIDENCE_COUNT_MISMATCH' using errcode = '40001';
  end if;

  update public.activity_reconciliation_state
  set reconciled_generation = target_expected_generation,
      reconciled_at = clock_timestamp()
  where doctor_id = target_doctor_id
    and period_day = target_period_day;
end;
$$;
alter function public.ack_activity_reconciliation(uuid, date, bigint, bigint)
  owner to dd_metrics_rollup;

-- Replace the I1 Activity close with generation-backed proof. The same
-- day-scoped advisory transaction lock is taken by minute writes, registration,
-- replay, acknowledgement, and close. A write racing with close therefore waits
-- and, once admitted, increments the generation and deletes stale completeness.
create or replace function public.finalize_activity_measurement_day(
  target_period_day date,
  target_source_version bigint,
  target_ingestion_complete boolean
) returns void
language plpgsql
security definer
set search_path = public, pg_temp
as $$
declare
  d record;
  c record;
  v_generation bigint;
  v_reconciled bigint;
begin
  if target_period_day is null or target_source_version is null or target_source_version < 0 then
    raise exception 'O1F_ACTIVITY_CLOSE_ARGUMENT_INVALID' using errcode = '22023';
  end if;
  if target_ingestion_complete is distinct from true then
    raise exception 'O1F_ACTIVITY_CLOSE_ATTESTATION_REQUIRED' using errcode = '22023';
  end if;

  perform pg_catalog.pg_advisory_xact_lock(
    pg_catalog.hashtextextended('dd:o1f:activity-day:' || target_period_day::text, 0)
  );

  -- First prove the complete eligible Doctor set. No coverage is mutated until
  -- every Doctor/day is present and reconciled to its current generation.
  for d in
    select distinct p.doctor_id
    from public.pilot_participations p
    where p.status in ('ENROLLED','COMPLETED')
      and p.enrolled_on <= target_period_day
      and public.pilot_consent_covers_day(
        p.cohort_code,
        p.participation_id,
        'PRODUCT_USAGE_ANALYTICS',
        target_period_day
      )
    order by p.doctor_id
  loop
    select s.evidence_generation, s.reconciled_generation
    into v_generation, v_reconciled
    from public.activity_reconciliation_state s
    where s.doctor_id = d.doctor_id
      and s.period_day = target_period_day
    for update;

    if not found or v_reconciled is distinct from v_generation then
      raise exception 'O1F_ACTIVITY_CLOSE_RECONCILIATION_REQUIRED' using errcode = '55000';
    end if;
  end loop;

  for d in
    select distinct p.doctor_id
    from public.pilot_participations p
    where p.status in ('ENROLLED','COMPLETED')
      and p.enrolled_on <= target_period_day
      and public.pilot_consent_covers_day(
        p.cohort_code,
        p.participation_id,
        'PRODUCT_USAGE_ANALYTICS',
        target_period_day
      )
  loop
    perform public.mark_telemetry_day_coverage(
      target_period_day,
      d.doctor_id,
      'ACTIVITY',
      true,
      target_source_version
    );
  end loop;

  if exists (
    select 1
    from public.pilot_participations p
    where p.status in ('ENROLLED','COMPLETED')
      and p.enrolled_on <= target_period_day
      and public.pilot_consent_covers_day(
        p.cohort_code,
        p.participation_id,
        'PRODUCT_USAGE_ANALYTICS',
        target_period_day
      )
      and not exists (
        select 1
        from public.telemetry_day_coverage t
        where t.period_day = target_period_day
          and t.principal_doctor_id = p.doctor_id
          and t.measurement_domain = 'ACTIVITY'
          and t.is_complete
      )
  ) then
    raise exception 'O1F_ACTIVITY_CLOSE_SOURCE_VERSION_STALE' using errcode = '40001';
  end if;

  perform public.rebuild_doctor_daily_activity_agg(target_period_day);

  for c in select distinct p.cohort_code from public.pilot_participations p
  loop
    perform public.rebuild_pilot_status_daily_agg(target_period_day, c.cohort_code);
  end loop;

  perform public.purge_expired_engagement_minutes();
end;
$$;
alter function public.finalize_activity_measurement_day(date, bigint, boolean)
  owner to dd_metrics_rollup;

-- I2 internal mutation needs DELETE only to invalidate stale accepted coverage;
-- no API role receives direct table access.
grant delete on public.telemetry_day_coverage to dd_metrics_rollup;

-- Remove default/public execution from every new I2 function, then grant only
-- the trusted server capabilities required by integration/runtime workers.
revoke execute on function public.resolve_doctor_profile_id(uuid)
  from public, anon, authenticated, service_role,
       dd_metrics_reader, dd_pilot_writer, dd_retention;
revoke execute on function public.register_activity_reconciliation_day(uuid, date, text)
  from public, anon, authenticated, service_role,
       dd_metrics_reader, dd_pilot_writer, dd_retention;
revoke execute on function public.record_engagement_minute(uuid, date, timestamptz, text, text)
  from public, anon, authenticated, service_role,
       dd_metrics_reader, dd_pilot_writer, dd_retention;
