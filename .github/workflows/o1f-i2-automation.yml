        select public.record_engagement_minute(
          ${raceDoctors[0].doctorId}, ${boundary.race_day}::date,
          ${boundary.before_stamp}::timestamptz, 'DASHBOARD', 'UTC'
        )
      `);
    });
    await expectRefused(tx, "wrong clinic day cannot reclassify a minute", "O1A_MINUTE_PERIOD_DAY_MISMATCH", async (sp) => {
      await service(sp, (r) => r`
        select public.record_engagement_minute(
          ${raceDoctors[1].doctorId}, ${boundary.local_day}::date,
          ${boundary.before_stamp}::timestamptz, 'DASHBOARD', ${boundary.name}
        )
      `);
    });
    await expectRefused(tx, "future-skew bound enforced", "O1A_MINUTE_TIMESTAMP_OUT_OF_RANGE", async (sp) => {
      await service(sp, (r) => r`
        select public.record_engagement_minute(
          ${raceDoctors[1].doctorId}, ${boundary.local_day}::date,
          clock_timestamp() + interval '5 minutes', 'DASHBOARD', ${boundary.name}
        )
      `);
    });
  });

  console.log("\n7. Reconciliation acknowledgement + initial close");
  await sql.begin(async (tx) => {
    const target = await reconcile(tx, raceDoctors[0].doctorId, boundary.race_day, 1);
    await service(tx, (sp) => sp`
      select public.ingest_activity_contribution(
        'DOCTOR_ENGAGED_MINUTES_DAILY', ${raceDoctors[0].doctorId}, ${boundary.race_day}::date,
        '*', 1, 'O1A_INTERACTION_METER', ${target.generation}
      )
    `;
    await service(tx, (sp) => sp`
      select public.ingest_activity_contribution(
        'DOCTOR_ACTIVE_DAY', ${raceDoctors[0].doctorId}, ${boundary.race_day}::date,
        '*', 1, 'O1A_INTERACTION_METER', ${target.generation}
      )
    `;
    await service(tx, (sp) => sp`
      select public.ingest_activity_contribution(
        'DOCTOR_SESSION_COUNT_DAILY', ${raceDoctors[0].doctorId}, ${boundary.race_day}::date,
        '*', 1, 'O1A_INTERACTION_METER', ${target.generation}
      )
    `;
    for (let i = 1; i < raceDoctors.length; i += 1) {
      await reconcile(tx, raceDoctors[i].doctorId, boundary.race_day, 0);
    }
    await service(tx, (sp) => sp`
      select public.finalize_activity_measurement_day(${boundary.race_day}::date, 1, true)
    `);
    const [{ n }] = await tx`
      select count(*)::int as n from telemetry_day_coverage
      where period_day=${boundary.race_day}::date and measurement_domain='ACTIVITY' and is_complete
    `;
    check(n === 5, "initial reconciled race day closes completely");
  });

  console.log("\n8. Concurrent close/write serialization and late-write invalidation");
  let releaseBlock;
  let blockerReady;
  const blockerReadyPromise = new Promise((resolve) => { blockerReady = resolve; });
  const blocker = sql.begin(async (tx) => {
    await tx`
      select 1 from activity_reconciliation_state
      where doctor_id=${raceDoctors[0].doctorId} and period_day=${boundary.race_day}::date
      for update
    `;
    blockerReady();
    await new Promise((resolve) => { releaseBlock = resolve; });
  });
  await blockerReadyPromise;

  const closeRace = sql.begin((tx) => service(tx, (sp) => sp`
    select public.finalize_activity_measurement_day(${boundary.race_day}::date, 2, true)
  `));
  await sleep(200);
  const writeRace = sql.begin((tx) => service(tx, (sp) => sp`
    select public.record_engagement_minute(
      ${raceDoctors[0].doctorId}, ${boundary.race_day}::date,
      ${boundary.before_stamp}::timestamptz, 'DASHBOARD', ${boundary.name}
    ) as inserted
  `));
  await sleep(200);
  releaseBlock();
  const [, , raceWriteRows] = await Promise.all([blocker, closeRace, writeRace]);
  check(raceWriteRows[0].inserted === true, "racing unique minute is eventually admitted");

  await sql.begin(async (tx) => {
    const [state] = await tx`
      select evidence_generation, reconciled_generation
      from activity_reconciliation_state
      where doctor_id=${raceDoctors[0].doctorId} and period_day=${boundary.race_day}::date
    `;
    check(Number(state.evidence_generation) === 2 && state.reconciled_generation === null,
      "racing write advances generation and makes Doctor/day dirty");
    const [{ n }] = await tx`
      select count(*)::int as n from telemetry_day_coverage
      where doctor_id is null
    `.catch(() => [{ n: -1 }]);
    void n;
    const [{ coverage }] = await tx`
      select count(*)::int as coverage from telemetry_day_coverage
      where period_day=${boundary.race_day}::date
        and principal_doctor_id=${raceDoctors[0].doctorId}
        and measurement_domain='ACTIVITY'
        and is_complete
    `;
    check(coverage === 0, "racing write invalidates stale ACTIVITY completeness after close");
    await expectRefused(tx, "dirty generation blocks subsequent finalize", "O1F_ACTIVITY_CLOSE_RECONCILIATION_REQUIRED", async (sp) => {
      await service(sp, (r) => r`
        select public.finalize_activity_measurement_day(${boundary.race_day}::date, 3, true)
      `);
    });
  });

  console.log("\n9. Reconcile new generation, then prove legitimate late write invalidates again");
  await sql.begin(async (tx) => {
    const rerun = await reconcile(tx, raceDoctors[0].doctorId, boundary.race_day, 2);
    check(rerun.generation === 2, "worker acknowledges exactly generation 2");
    await service(tx, (sp) => sp`
      select public.ingest_activity_contribution(
        'DOCTOR_ENGAGED_MINUTES_DAILY', ${raceDoctors[0].doctorId}, ${boundary.race_day}::date,
        '*', 1, 'O1A_INTERACTION_METER', 2
      )
    `;
    await service(tx, (sp) => sp`
      select public.ingest_activity_contribution(
        'DOCTOR_ACTIVE_DAY', ${raceDoctors[0].doctorId}, ${boundary.race_day}::date,
        '*', 1, 'O1A_INTERACTION_METER', 2
      )
    `;
    await service(tx, (sp) => sp`
      select public.ingest_activity_contribution(
        'DOCTOR_SESSION_COUNT_DAILY', ${raceDoctors[0].doctorId}, ${boundary.race_day}::date,
        '*', 1, 'O1A_INTERACTION_METER', 2
      )
    `;
    await service(tx, (sp) => sp`
      select public.finalize_activity_measurement_day(${boundary.race_day}::date, 3, true)
    `);
    const [late] = await service(tx, (sp) => sp`
      select public.record_engagement_minute(
        ${raceDoctors[0].doctorId}, ${boundary.race_day}::date,
        ${boundary.before_stamp}::timestamptz, 'PATIENTS', ${boundary.name}
      ) as inserted
    `;
    check(late.inserted === true, "legitimate later unique minute is accepted");
    const [dirty] = await tx`
      select evidence_generation, reconciled_generation
      from activity_reconciliation_state
      where doctor_id=${raceDoctors[0].doctorId} and period_day=${boundary.race_day}::date
    `;
    check(Number(dirty.evidence_generation) === 3 && dirty.reconciled_generation === null,
      "late minute re-dirties previously complete Doctor/day");
    const [{ coverage }] = await tx`
      select count(*)::int as coverage from telemetry_day_coverage
      where period_day=${boundary.race_day}::date
        and principal_doctor_id=${raceDoctors[0].doctorId}
        and measurement_domain='ACTIVITY' and is_complete
    `;
    check(coverage === 0, "late minute removes stale complete coverage");
  });

  if (failures > 0) {
    console.error(`\nO1-F-I2 CONTRACT: FAIL (${failures} checks)`);
    process.exitCode = 1;
  } else {
    console.log("\nO1-F-I2 CONTRACT: PASS");
  }
} catch (error) {
  console.error("\nO1-F-I2 VERIFIER ABORTED");
  console.error(error);
  process.exitCode = 1;
} finally {
  await sql.end({ timeout: 2 });
}
