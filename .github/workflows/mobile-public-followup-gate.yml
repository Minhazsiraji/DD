name: Mobile Public Follow-up Gate

on:
  push:
    branches:
      - fix/mobile-responsive-p0

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Focused mobile and public tests
        run: npx vitest run src/features/mobile-responsive.test.ts src/features/public-booking/public-profile-ui.test.ts src/features/public-booking/commercial-boundary.test.ts src/features/public-booking/public-failure-shape.test.ts src/features/appointments/schema.test.ts src/features/appointments/when-fields.test.ts
      - name: Full tests
        run: npm test
      - name: Build
        run: npm run build
