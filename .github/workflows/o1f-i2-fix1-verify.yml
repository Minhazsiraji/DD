name: O1-F-I2 fix1 and exact verify
on:
  push:
    branches: [o1/f-i2-verify-helper-2]
permissions:
  contents: write
jobs:
  fix1-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o1/f-integration-closure-i2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix demonstrated I1 syntax defect only
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/verify-o1f-i1-contract.mjs')
          s=p.read_text()
          old="""      await service(sp, (r) => r`
        select public.record_engagement_minute(
          ${minuteDoctorId}, ${minuteBucket}::timestamptz,
          'UNKNOWN', 'UTC'
        )
      `;
    });"""
          new="""      await service(sp, (r) => r`
        select public.record_engagement_minute(
          ${minuteDoctorId}, ${minuteBucket}::timestamptz,
          'UNKNOWN', 'UTC'
        )
      `);
    });"""
          if s.count(old) != 1:
              raise SystemExit(f'I1 syntax anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
      - name: Syntax-check exact verifier set before commit
        shell: bash
        run: |
          node --check scripts/verify-o1f-i1-contract.mjs
          node --check scripts/verify-o1f-i2-contract.mjs
      - name: Commit and push corrected candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-o1f-i1-contract.mjs
          git commit -m "test(o1-f-i2): repair superseded writer verifier syntax"
          git push origin HEAD:o1/f-integration-closure-i2
      - name: Install verifier dependency outside repository
        shell: bash
        run: |
          mkdir -p /tmp/pgdep && cd /tmp/pgdep
          npm init -y >/dev/null
          npm install postgres@3.4.9 --ignore-scripts --no-audit --no-fund >/dev/null
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/pgdep/node_modules node_modules
      - name: Exact-SHA preflight
        shell: bash
        run: |
          rm node_modules
          echo "HEAD=$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          echo "BLOB=$(git hash-object supabase/policies/0047_o1_owner_analytics_authority.sql)"
          echo "SHA256=$(sha256sum supabase/policies/0047_o1_owner_analytics_authority.sql | awk '{print $1}')"
          git diff --name-only 9f75403c948ccf26b9bc644f3f476683d74bb522..HEAD
          ln -s /tmp/pgdep/node_modules node_modules
      - name: Bootstrap cluster roles
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $bootstrap$
          begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role noinherit bypassrls; end if;
          end
          $bootstrap$;
          SQL
      - name: Run eight exact-SHA verifiers on fresh disposable DBs
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          tests=(verify-o1f-activity-day-grain.mjs verify-o1f-owner-aal2-and-consent.mjs verify-o1f-owner-surface.mjs verify-o1f-pilot-plane-isolation.mjs verify-o1f-r2-contract.mjs verify-o1f-r3-contract.mjs verify-o1f-i1-contract.mjs verify-o1f-i2-contract.mjs)
          i=0
          for t in "${tests[@]}"; do
            i=$((i+1)); db="o1fi2fix1_${i}"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "create database ${db};" >/dev/null
            psql -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 >/dev/null <<'SQL'
            create extension if not exists pgcrypto;
            create schema if not exists auth;
            create table if not exists auth.users(id uuid primary key default gen_random_uuid());
            create or replace function auth.uid() returns uuid language sql stable as $uid$
              select nullif(coalesce(nullif(current_setting('request.jwt.claims', true), ''), '{}')::jsonb ->> 'sub','')::uuid;
            $uid$;
            create or replace function auth.jwt() returns jsonb language sql stable as $jwt$
              select coalesce(nullif(current_setting('request.jwt.claims', true), ''), '{}')::jsonb;
            $jwt$;
            grant usage on schema auth to public;
            grant execute on function auth.uid() to public;
            grant execute on function auth.jwt() to public;
            SQL
            echo "===== ${t} @ $(git rev-parse HEAD) ====="
            DATABASE_URL="postgresql://postgres:postgres@localhost:5432/${db}" DIRECT_URL="postgresql://postgres:postgres@localhost:5432/${db}" node "scripts/${t}"
          done
      - name: Exact-SHA postflight
        if: always()
        shell: bash
        run: |
          rm -f node_modules
          echo "POST_HEAD=$(git rev-parse HEAD)"
          echo "POST_STATUS=$(git status --porcelain | wc -l)"
          echo "POST_BLOB=$(git hash-object supabase/policies/0047_o1_owner_analytics_authority.sql)"
          echo "POST_SHA256=$(sha256sum supabase/policies/0047_o1_owner_analytics_authority.sql | awk '{print $1}')"
          test -z "$(git status --porcelain)"
