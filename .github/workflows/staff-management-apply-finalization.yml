name: Staff Management Apply Finalization
on:
  push:
    branches: [feature/staff-management-v1]
    paths:
      - scripts/staff-management/apply-finalization.py
      - .github/workflows/staff-management-apply-finalization.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/staff-management-v1
          fetch-depth: 0
      - name: Apply reviewed Staff transforms
        run: python scripts/staff-management/apply-finalization.py
      - name: Validate diff
        run: git diff --check
      - name: Commit transformed candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase/migrations/0053_staff_management_v1.sql
          git diff --cached --quiet && exit 0
          git commit -m "feat(staff): complete managed operational integration"
          git push origin HEAD:feature/staff-management-v1
