name: Prescription Correction Window Exact-SHA QA

on:
  push:
    branches:
      - qa/prescription-window-proof-8e050abe

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      DD_CORRECTION_WINDOW_LOCAL_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DD_V2_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-proof-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      AI_MODE: mock
      NOTIFICATION_MODE: mock
      PAYMENT_MODE: mock

    steps:
      - name: Checkout exact proof candidate
        uses: actions/checkout@v4
        with:
          ref: b985c3c79ce9d75ef93715437d077dd571c40cb6
          fetch-depth: 0

      - name: Exact SHA and product-diff guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b985c3c79ce9d75ef93715437d077dd571c40cb6"
          git diff --check 1147e993158f9abee80a5307cf9932ff95cb43bb..HEAD
          printf '%s\n' \
            db/p1/0014_p1_prescription_correction_window.sql \
            scripts/verify-prescription-correction-window-boundary.mjs \
            scripts/verify-prescription-correction-window.mjs \
            src/features/prescriptions/correction-window-security.test.ts \
            supabase/policies/0041_prescription_correction_window.sql \
            > /tmp/expected-files
          git diff --name-only 1147e993158f9abee80a5307cf9932ff95cb43bb..HEAD | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: P0 protected drift guard
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only 5d58f154a8fd18129e28614ccc038f0a6af66b8f..HEAD -- \
            db/schema db/functions db/policies db/grants db/storage db/seed \
            db/manifest.toml db/golden-p0.sql)"

      - name: Install required Node dependencies
        run: npm ci

      - name: Committed correction-window static proof
        run: npx vitest run src/features/prescriptions/correction-window-security.test.ts

      - name: PostgreSQL exact boundary proof
        run: node scripts/verify-prescription-correction-window-boundary.mjs

      - name: PostgreSQL runtime and V2 dynamic proof
        run: node scripts/verify-prescription-correction-window.mjs

      - name: Existing prescription regression tests
        run: npx vitest run src/features/prescriptions

      - name: Prepare ephemeral local Supabase substrate
        shell: bash
        run: |
          set -euo pipefail
          rm -f supabase/config.toml
          node node_modules/supabase/dist/supabase.js init --force
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('supabase/config.toml')
          s = p.read_text()
          s = re.sub(r'^project_id\s*=\s*"[^"]*"', 'project_id = "DD"', s, count=1, flags=re.M)
          s = re.sub(r'(\[db\][\s\S]*?^major_version\s*=\s*)\d+', r'\g<1>17', s, count=1, flags=re.M)
          def disable(block, text):
              pattern = rf'(\[{re.escape(block)}\][\s\S]*?)(?=\n\[|\Z)'
              m = re.search(pattern, text, flags=re.M)
              if m:
                  body = re.sub(r'^enabled\s*=\s*true\s*$', 'enabled = false', m.group(1), flags=re.M)
                  if not re.search(r'^enabled\s*=', body, flags=re.M):
                      body += '\nenabled = false\n'
                  return text[:m.start()] + body + text[m.end():]
              return text + f'\n[{block}]\nenabled = false\n'
          s = disable('db.migrations', s)
          s = disable('db.seed', s)
          p.write_text(s)
          PY
          grep -A3 '^\[db\]$' supabase/config.toml
          grep -A2 '^\[db.migrations\]$' supabase/config.toml
          node node_modules/supabase/dist/supabase.js start > /tmp/dd-local-supabase-start.log

      - name: P0 local deployment determinism and verification
        shell: bash
        env:
          DD_V2_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          npm run db:verify:determinism
          npm run db:verify:p0

      - name: Accepted P1 plus candidate 0014 deterministic follow-on
        shell: bash
        env:
          DD_V2_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          LOCAL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          CLI='node_modules/supabase/dist/supabase.js'
          git worktree add --detach /tmp/dd-p1 d03c84687f473673fa242ad2f8b4ba08f8428380
          test "$(git -C /tmp/dd-p1 rev-parse HEAD)" = "d03c84687f473673fa242ad2f8b4ba08f8428380"
          test ! -e /tmp/dd-p1/db/p1/0014_p1_prescription_correction_window.sql
          for round in a b; do
            node "$CLI" db reset --local --no-seed
            (
              cd /tmp/dd-p1
              DD_V2_LOCAL_DATABASE_URL="$LOCAL" \
                node scripts/p1-run.mjs scripts/deploy-p1.mjs --database-url
            )
            psql "$LOCAL" -v ON_ERROR_STOP=1 \
              -f "$GITHUB_WORKSPACE/db/p1/0014_p1_prescription_correction_window.sql"
            psql "$LOCAL" -X -At -v ON_ERROR_STOP=1 > "/tmp/p1-$round.txt" <<'SQL'
          select pg_get_functiondef('public.create_prescription_correction(uuid,text)'::regprocedure);
          select coalesce(p.proacl::text,'') from pg_proc p where p.oid='public.create_prescription_correction(uuid,text)'::regprocedure;
          select
            has_function_privilege('authenticated','public.create_prescription_correction(uuid,text)','EXECUTE'),
            has_function_privilege('anon','public.create_prescription_correction(uuid,text)','EXECUTE'),
            has_function_privilege('service_role','public.create_prescription_correction(uuid,text)','EXECUTE');
          SQL
            grep -F 'CORRECTION_WINDOW_EXPIRED' "/tmp/p1-$round.txt"
            grep -F 'clock_timestamp()' "/tmp/p1-$round.txt"
            tail -n 1 "/tmp/p1-$round.txt" | grep -F 't|f|f'
          done
          diff -u /tmp/p1-a.txt /tmp/p1-b.txt

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Stop ephemeral local Supabase
        if: always()
        shell: bash
        run: node node_modules/supabase/dist/supabase.js stop --no-backup || true
