name: DD Visual Personalization 01 QA

on:
  push:
    branches:
      - md2/dd-visual-personalization-01-background-appearance

permissions:
  contents: read

env:
  BASE_SHA: 77f78ced6202c34cee11dc06aeff4638beab9cb1
  DEFAULT_BG_BLOB: 309bec970956588a496ece85969f7ea129a1dafa
  GLOBALS_BLOB: 9e5d07175e729f142b4cff5574ded5af5a61bdbf
  LIQUID_BLOB: a35db74b73aa843caf5086d72a4fdae006f244c8
  MATERIAL_BLOB: eea7e0691a67a5d8df231537a4247a5c5806b934
  OPENAI_API_KEY: ""
  DEEPGRAM_API_KEY: ""
  PA1_SYNTHETIC_AI_EVAL: disabled

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Scope and frozen-default guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/dd-visual-personalization-01-qa.yml|\
              src/app/\(app\)/layout.tsx|\
              src/app/\(app\)/settings/page.tsx|\
              src/app/\(app\)/settings/appearance/page.tsx|\
              src/features/settings/background-preference.ts|\
              src/features/settings/background-appearance.test.ts|\
              src/features/settings/components/background-appearance.tsx|\
              src/features/settings/components/background-canvas.tsx)
                ;;
              *)
                echo "Unexpected changed file: $file" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
          test "$(git rev-parse HEAD:src/app/global-background-test.css)" = "$DEFAULT_BG_BLOB"
          test "$(git rev-parse HEAD:src/app/globals.css)" = "$GLOBALS_BLOB"
          test "$(git rev-parse HEAD:src/app/app-unified-liquid.css)" = "$LIQUID_BLOB"
          test "$(git rev-parse HEAD:src/app/dd-material-system.css)" = "$MATERIAL_BLOB"
          if printf '%s\n' "$changed" | grep -E '(^|/)(supabase|migrations|policies)(/|$)|\.sql$'; then
            echo "Protected DB/schema surface changed" >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Appearance focused tests
        run: npx vitest run src/features/settings/background-appearance.test.ts

      - name: Full repository tests
        run: npm test

      - name: Next type generation
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check "$BASE_SHA"...HEAD
