name: Loop C Deepgram Final Gate

on:
  push:
    branches:
      - fix/loop-c-deepgram-nova3-pilot

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Focused voice, Deepgram, browser regression and Rx dictation
        run: npx vitest run src/features/dictation/dictation.test.ts src/features/dictation/voice-language.test.ts src/features/dictation/deepgram-pilot.test.ts src/features/dictation/browser-voice-regression.test.ts src/features/prescriptions/prescription-dictation.test.ts
      - name: Clinical authority and prescription finalization regressions
        run: npx vitest run src/features/encounters/mutation-gate.test.ts src/features/prescriptions/freeze.test.ts src/features/prescriptions/finalize-outcome.test.ts src/features/prescriptions/review-bundle.test.ts src/features/prescriptions/medicine-draft.test.ts src/features/prescriptions/correction.test.ts src/features/security/policy.test.ts src/features/appointments/schema.test.ts src/features/queue/schema.test.ts
      - name: Full tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
