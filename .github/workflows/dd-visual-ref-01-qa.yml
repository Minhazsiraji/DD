name: DD Visual Ref 01 QA

on:
  push:
    branches:
      - md2/dd-visual-ref-01-glass-canvas

permissions:
  contents: read

env:
  BASE_SHA: 37e9b2421ad9c708701e12b7d1d4d981f37d75af
  GLOBALS_BLOB: 9e5d07175e729f142b4cff5574ded5af5a61bdbf
  LIQUID_BLOB: a35db74b73aa843caf5086d72a4fdae006f244c8
  MATERIAL_BLOB: eea7e0691a67a5d8df231537a4247a5c5806b934
  OPENAI_API_KEY: ""
  DEEPGRAM_API_KEY: ""
  PA1_SYNTHETIC_AI_EVAL: disabled

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scope ancestry and visual-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          cat > /tmp/expected <<'EOF'
          .github/workflows/dd-visual-ref-01-qa.yml
          src/app/global-background-test.css
          src/features/dd-visual-ref-01.test.ts
          EOF
          git diff --name-only "$BASE_SHA"...HEAD | sort > /tmp/actual
          sort /tmp/expected -o /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test "$(git hash-object src/app/globals.css)" = "$GLOBALS_BLOB"
          test "$(git hash-object src/app/app-unified-liquid.css)" = "$LIQUID_BLOB"
          test "$(git hash-object src/app/dd-material-system.css)" = "$MATERIAL_BLOB"
          if git diff --name-only "$BASE_SHA"...HEAD | grep -E '(^|/)(supabase|migrations?|schema)(/|$)|\.sql$'; then exit 1; fi
          test "$(node -p "require('./vercel.json').regions[0]")" = "icn1"

      - name: Visual and theme source contract
        run: npx vitest run src/features/dd-visual-ref-01.test.ts src/features/global-visual-consistency.test.ts

      - name: Dashboard regression
        run: npx vitest run src/features/dashboard/d1-dashboard-pilot.test.ts src/features/dashboard/m1-dashboard-performance.test.ts

      - name: Consultation regression
        run: npx vitest run src/features/encounters/m2-consultation-workspace.test.ts src/features/encounters/m2-responsive-widths.test.ts src/features/encounters/previous-visit.test.ts

      - name: Prescription M3 regression
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find src/features/prescriptions -type f -name '*.test.ts' -print | sort)
          npx vitest run "${files[@]}"

      - name: Investigation V1 regression
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find src/features/encounters -maxdepth 1 -type f -name 'investigation-v1*.test.ts' -print | sort)
          npx vitest run "${files[@]}"

      - name: Patients regression
        run: npx vitest run src/features/patients/m1-implementation.test.ts src/features/patients/identity.test.ts

      - name: Mobile tablet desktop responsive regression
        run: npx vitest run src/features/mobile-responsive.test.ts src/features/encounters/m2-responsive-widths.test.ts src/features/prescriptions/m3-responsive-widths.test.ts src/features/dashboard/d1-dashboard-pilot.test.ts

      - name: Full repository tests
        run: npm test

      - name: Next route type generation
        run: npx next typegen

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check "$BASE_SHA"...HEAD
