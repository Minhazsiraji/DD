name: P-C1 Final Composite Gate

on:
  push:
    branches: [integration/pilot-final-composite]
  workflow_dispatch:

permissions:
  contents: read

env:
  M4_BASE: b7590d276cdad428d99901d1f26d9864b52359c0
  NEXT_PUBLIC_SUPABASE_URL: https://synthetic-pc1.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_pc1_synthetic_key_000000000000000000000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  AI_MODE: mock
  NOTIFICATION_MODE: mock
  PAYMENT_MODE: mock
  PA1_PROPOSAL_SIGNING_SECRET: pc1-signing-secret-at-least-32-bytes-long
  CRON_SECRET: pc1-cron-secret-at-least-32-bytes-long
  O1_PILOT_CLOSE_TIME_ZONE: Asia/Dhaka

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pc1
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pc1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - name: Install exact lockfile
        run: npm ci --ignore-scripts

      - name: Frozen authority and migration manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$M4_BASE" HEAD)" = "$M4_BASE"
          declare -A BLOBS=(
            [src/features/encounters/components/consultation-workspace.tsx]=749f53f2a9dd1fef1474f2fbe6b5fe9bd7c17113
            [src/features/encounters/components/investigation-panel.tsx]=bde1eedf119ba5aaa597d76892c3d524283b0961
            [src/features/encounters/investigation-v1-read-actions.ts]=28e2c217fe42832d6f2c066d8a62cf7355187db4
            [src/features/encounters/investigation-v1-ui.test.ts]=700983430a3adb01238123bf4a3f5aedfb62814a
            [src/features/encounters/investigation-v1-ui.ts]=e91c2ac616a20521ddcb56d9a76464d86f8ad704
            [src/features/encounters/investigation-v1-actions.ts]=0d848ef8eb12ba0e274f3e62e2e583d14e19bc56
            [src/features/encounters/investigation-v1-queries.ts]=2bbbd5cb7a9f649e859834b59d1b64bf080318de
            [src/features/encounters/investigation-v1-contract.ts]=c760423862f94b408d579284e1c1acd61fc9b60d
            [supabase/policies/0046_investigation_v1_foundation.sql]=5e105f3015f1251279e3ba94b5c3b745998b8e22
            [supabase/policies/0047_o1_owner_analytics_authority.sql]=b8645248fc22a98a2c2aa10f1b21ad0b5c9679d6
            [scripts/verify-o1f-i2-contract.mjs]=6a7f39006fc28e5bd40b628011259b528f1ef122
          )
          for f in "${!BLOBS[@]}"; do test "$(git rev-parse HEAD:$f)" = "${BLOBS[$f]}"; done
          test "$(sha256sum supabase/policies/0047_o1_owner_analytics_authority.sql | awk '{print $1}')" = 3a316805d32391241ed506ec9627d9e77b21b20a0a4c1f36405b03e0695a2190
          test ! -e supabase/policies/0048_o1_owner_analytics_authority.sql
          for f in supabase/policies/004{1,2,3,4,5,6,7}_*.sql supabase/policies/004{8,9}_*.sql supabase/policies/005{0,1}_*.sql; do
            test "$(git rev-parse HEAD:$f)" = "$(git rev-parse $M4_BASE:$f)"
          done
          printf '%s\n' \
            .github/workflows/pc1-final-composite-gate.yml package.json package-lock.json \
            scripts/verify-o1f-i2-contract.mjs \
            src/features/encounters/components/consultation-workspace.tsx \
            src/features/encounters/components/investigation-panel.tsx \
            src/features/encounters/investigation-v1-actions.ts \
            src/features/encounters/investigation-v1-contract.ts \
            src/features/encounters/investigation-v1-queries.ts \
            src/features/encounters/investigation-v1-read-actions.ts \
            src/features/encounters/investigation-v1-ui.test.ts \
            src/features/encounters/investigation-v1-ui.ts | sort > /tmp/allowed
          git diff --name-only "$M4_BASE"...HEAD | sort > /tmp/actual
          diff -u /tmp/allowed /tmp/actual
          echo PC1_AUTHORITY_MANIFEST=PASS

      - name: Exact dependency graph
        shell: bash
        run: |
          node <<'NODE'
          const p=require('./package.json'), l=require('./package-lock.json');
          const e={next:'16.3.4',vitest:'4.1.11',sharp:'0.35.4','js-yaml':'4.3.2',hono:'4.13.7'};
          if(p.dependencies.next!==e.next || p.devDependencies.vitest!==e.vitest) process.exit(2);
          for(const [n,v] of Object.entries(e)){const a=l.packages?.[`node_modules/${n}`]?.version; console.log(`PC1_DEP_VERSION ${n}=${a}`); if(a!==v) process.exit(3);}
          NODE
          npm ls next sharp js-yaml hono vitest --all

      - name: M3 regression
        run: npx vitest run src/features/prescriptions
      - name: Investigation regression
        run: npx vitest run src/features/encounters/investigation-v1-ui.test.ts
      - name: M4 Medicine regression
        run: npx vitest run src/features/medicines

      - name: O1 F-I2 final verifier
        shell: bash
        env: {PGPASSWORD: postgres}
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d pc1 -v ON_ERROR_STOP=1 <<'SQL'
          do $bootstrap$
          begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role noinherit bypassrls; end if;
            if not exists (select 1 from pg_roles where rolname='authenticator') then create role authenticator login password 'qa_test_only' noinherit; end if;
          end $bootstrap$;
          grant anon, authenticated, service_role to authenticator;
          create extension if not exists pgcrypto;
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key default gen_random_uuid());
          create or replace function auth.uid() returns uuid language sql stable as $uid$ select nullif(coalesce(nullif(current_setting('request.jwt.claims',true),''),'{}')::jsonb->>'sub','')::uuid; $uid$;
          create or replace function auth.jwt() returns jsonb language sql stable as $jwt$ select coalesce(nullif(current_setting('request.jwt.claims',true),''),'{}')::jsonb; $jwt$;
          grant usage on schema auth to public;
          grant execute on function auth.uid(), auth.jwt() to public;
          SQL
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/pc1 DIRECT_URL=postgresql://postgres:postgres@localhost:5432/pc1 AUTHENTICATOR_URL=postgresql://authenticator:qa_test_only@localhost:5432/pc1 node scripts/verify-o1f-i2-contract.mjs

      - name: O1 runtime regression
        run: npx vitest run src/features/engagement src/features/owner src/features/ai/telemetry-durable-sink.test.ts src/features/prescriptions/service-key-containment.test.ts
      - name: Security regression
        run: npx vitest run src/features/security/prelaunch-sec01b.test.ts src/features/security/post-mfa-destination.test.ts
      - name: Full repository tests
        run: npm test
      - name: Next typegen
        run: npx next typegen
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check "$M4_BASE"...HEAD
      - name: Production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          node <<'NODE'
          const a=require('/tmp/audit.json'),v=a.metadata?.vulnerabilities??{};
          const total=v.total??['info','low','moderate','high','critical'].reduce((s,k)=>s+(v[k]||0),0);
          console.log(`PC1_PROD_AUDIT_LOW=${v.low||0}`);
          console.log(`PC1_PROD_AUDIT_MODERATE=${v.moderate||0}`);
          console.log(`PC1_PROD_AUDIT_HIGH=${v.high||0}`);
          console.log(`PC1_PROD_AUDIT_CRITICAL=${v.critical||0}`);
          console.log(`PC1_PROD_AUDIT_TOTAL=${total}`);
          if((v.high||0)!==0||(v.critical||0)!==0) process.exit(1);
          NODE
      - name: Exact verified SHA
        run: echo PC1_FINAL_VERIFIED_SHA=$GITHUB_SHA
