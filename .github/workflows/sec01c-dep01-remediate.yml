name: SEC-01C DEP-01 Remediation Bootstrap

on:
  push:
    branches:
      - md/sec01c-dep01

permissions:
  contents: write

jobs:
  remediate:
    if: contains(github.event.head_commit.message, 'bootstrap DEP-01 remediation')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact base lockfile
        run: npm ci --ignore-scripts
      - name: Source reachability evidence
        shell: bash
        run: |
          echo '===== shadcn/hono/js-yaml direct source references ====='
          grep -RInE "from ['\"](shadcn|hono|js-yaml)['\"]|require\(['\"](shadcn|hono|js-yaml)['\"]\)" src scripts next.config.ts 2>/dev/null || true
          echo '===== next/image source references ====='
          grep -RInE "from ['\"]next/image['\"]|require\(['\"]next/image['\"]\)" src 2>/dev/null || true
          echo '===== sharp direct source references ====='
          grep -RInE "from ['\"]sharp['\"]|require\(['\"]sharp['\"]\)" src scripts next.config.ts 2>/dev/null || true
      - name: Apply minimum compatible security patches
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact next@16.3.4
          npm install --save-dev --save-exact vitest@4.1.11
          npm update sharp js-yaml hono
      - name: Verify patched package graph
        shell: bash
        run: |
          npm ls next sharp js-yaml hono vitest --all
          npm audit --json > /tmp/audit-full.json || true
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node <<'NODE'
          const fs=require('fs');
          for (const [label,path] of [['FULL','/tmp/audit-full.json'],['PROD','/tmp/audit-prod.json']]) {
            const a=JSON.parse(fs.readFileSync(path,'utf8'));
            const v=a.metadata?.vulnerabilities ?? {};
            console.log(`SEC01C_DEP01_BOOTSTRAP_${label}_COUNTS=${JSON.stringify(v)}`);
            for (const [name,item] of Object.entries(a.vulnerabilities ?? {})) {
              console.log(`SEC01C_DEP01_BOOTSTRAP_${label}_REMAINING=${JSON.stringify({name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable,via:item.via})}`);
            }
            if (label === 'PROD' && ((v.high ?? 0) !== 0 || (v.critical ?? 0) !== 0)) process.exitCode=1;
          }
          NODE
      - name: Commit only dependency manifests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- package.json package-lock.json
          git status --short
          test -z "$(git status --short | grep -vE '^( M|M |A |AM|MM) (package.json|package-lock.json)$' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(security): patch production dependency advisories'
          git push origin HEAD:md/sec01c-dep01
