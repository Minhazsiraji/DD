name: Loop C Adoption Final Gate

on:
  push:
    branches:
      - fix/loop-c-adoption-final-acceptance

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Focused adoption
        run: npx vitest run src/features/adoption/progress.test.ts src/features/adoption/adoption-boundary.test.ts
      - name: Focused commercial
        run: npx vitest run src/features/commercial/commercial.test.ts
      - name: Critical clinical and security regressions
        run: npx vitest run src/features/security/policy.test.ts src/features/encounters/mutation-gate.test.ts src/features/prescriptions/freeze.test.ts src/features/prescriptions/finalize-outcome.test.ts src/features/prescriptions/review-bundle.test.ts src/features/prescriptions/correction.test.ts src/features/booking-settings/hardening.test.ts src/features/public-booking/commercial-boundary.test.ts src/features/public-booking/booking-serial-boundary.test.ts src/features/appointments/schema.test.ts src/features/queue/schema.test.ts
      - name: Full tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
