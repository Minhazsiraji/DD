name: Loop C Public Profile Gate

on:
  push:
    branches:
      - fix/loop-c-public-profile-acceptance

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Focused public profile tests
        run: npx vitest run src/features/public-booking/public-profile-ui.test.ts src/features/public-booking/public-photo-boundary.test.ts src/features/public-booking/commercial-boundary.test.ts src/features/public-booking/booking-serial-boundary.test.ts src/features/public-booking/public-failure-shape.test.ts src/features/mobile-responsive.test.ts
      - name: Full tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
