name: O1-F-I2 executor
on: [push]
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o1/f-integration-closure-i2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          rm -rf node_modules/postgres
          mkdir -p node_modules/postgres
          tgz=$(npm pack postgres@3.4.9 --silent)
          tar -xzf "$tgz" -C node_modules/postgres --strip-components=1
          rm -f "$tgz"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: bash scripts/o1f-i2-bootstrap2.sh
