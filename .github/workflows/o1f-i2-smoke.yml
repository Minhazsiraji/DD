name: O1-F-I2 runner smoke
on:
  push:
    branches:
      - o1/f-i2-automation
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 .ci/o1f-i2-debug-source.py
