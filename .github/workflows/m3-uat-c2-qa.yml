name: M3 UAT C2 QA

on:
  push:
    branches:
      - ui/m3-prescription-v2

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: C2 scope and frozen-surface guard
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS=6f71ff494678915f5fc5cfe3c6174aea37af0199
          git diff --check "$PREVIOUS"...HEAD
          git diff --exit-code "$PREVIOUS" -- src/features/prescriptions/components/print-prescription.tsx src/features/prescriptions/components/finalized-prescription.tsx src/features/prescriptions/components/print-sheet.tsx src/app/globals.css
          unexpected="$(git diff --name-only "$PREVIOUS"...HEAD | grep -Ev '^(src/features/prescriptions/components/write-correction\.tsx|src/features/prescriptions/m3-uat-c1-layout\.test\.ts|\.github/workflows/m3-uat-c2-qa\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected C2 delta:"
            echo "$unexpected"
            exit 1
          fi
          if git diff --name-only "$PREVIOUS"...HEAD | grep -E '(^|/)(supabase|migrations|schema)(/|$)|\.sql$'; then
            echo "SQL/schema/migration drift detected"
            exit 1
          fi
          node -e 'const v=require("./vercel.json"); if (JSON.stringify(v.regions)!==JSON.stringify(["icn1"])) { console.error(v.regions); process.exit(1) } console.log("Vercel region:", v.regions[0])'

      - name: Focused C1 C2 correction responsive and print tests
        run: npx vitest run src/features/prescriptions/m3-uat-c1-layout.test.ts src/features/prescriptions/correction.test.ts src/features/prescriptions/correction-window.test.ts src/features/prescriptions/correction-window-security.test.ts src/features/prescriptions/m3-prescription-ui.test.ts src/features/prescriptions/m3-responsive-widths.test.ts src/features/mobile-responsive.test.ts src/features/prescriptions/print-media-regression.test.ts

      - name: Full prescription test directory
        run: npx vitest run src/features/prescriptions

      - name: Complete repository tests
        run: npm test

      - name: Next route type generation
        run: npx next typegen

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
