name: Loop C Medicines V1 Audit

on:
  push:
    branches:
      - audit/loop-c-medicines-v1

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused Medicines tests
        run: npx vitest run src/features/medicines
      - name: Rx authority and clinical security regressions
        run: npx vitest run src/features/prescriptions/medicine-draft.test.ts src/features/prescriptions/freeze.test.ts src/features/prescriptions/finalize-outcome.test.ts src/features/prescriptions/review-bundle.test.ts src/features/prescriptions/correction.test.ts src/features/encounters/mutation-gate.test.ts src/features/security/policy.test.ts src/features/patients/identity.test.ts
      - name: Full suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
