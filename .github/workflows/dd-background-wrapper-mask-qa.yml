name: DD Background Wrapper Mask QA

on:
  push:
    branches:
      - md2/dd-visual-personalization-01-r2-background-lock

permissions:
  contents: read

env:
  CORRECTION_BASE_SHA: 8bcc8c1e55cfc78f2634790f17439cc8da881cde
  REFERENCE_CSS_BLOB: 062f35853c07cf72e7f6d6438878a2e9f4ff6b79
  REFERENCE_IMAGE_BLOB: e50c9e62d3340206d18724784a94a9a295c3851c
  GLOBALS_BLOB: 9e5d07175e729f142b4cff5574ded5af5a61bdbf
  OPENAI_API_KEY: ""
  DEEPGRAM_API_KEY: ""
  PA1_SYNTHETIC_AI_EVAL: disabled

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Scope and exact-background guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$CORRECTION_BASE_SHA" HEAD)" = "$CORRECTION_BASE_SHA"
          changed="$(git diff --name-only "$CORRECTION_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/dd-background-wrapper-mask-qa.yml|src/components/marketing/marketing-shell.tsx) ;;
              *) echo "Unexpected correction file: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          test "$(git rev-parse HEAD:src/app/global-background-test.css)" = "$REFERENCE_CSS_BLOB"
          test "$(git rev-parse HEAD:public/dd-global-bg.webp)" = "$REFERENCE_IMAGE_BLOB"
          test "$(git rev-parse HEAD:src/app/globals.css)" = "$GLOBALS_BLOB"
          grep -Fq 'className="dd-public-stage min-h-screen bg-[#f6f9ff] text-slate-950"' src/components/marketing/marketing-shell.tsx
          grep -Fq '.dd-public-stage,' src/app/global-background-test.css
          grep -Fq 'background-color: transparent !important;' src/app/global-background-test.css

      - name: Install
        run: npm ci

      - name: Background personalization focused tests
        run: npx vitest run src/features/settings/background-appearance.test.ts

      - name: Full repository tests
        run: npm test

      - name: Next type generation
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check "$CORRECTION_BASE_SHA"...HEAD
