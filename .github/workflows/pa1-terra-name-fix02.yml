name: PA1 Terra Medicine Name Fidelity 02

on:
  workflow_dispatch:
    inputs:
      authorized_sha:
        description: Exact candidate SHA authorized for this paid live evaluation
        required: true
        type: string
      confirmation:
        description: Type RUN_AUTHORIZED_LIVE_EVAL to confirm paid provider execution
        required: true
        type: string

concurrency:
  group: pa1-terra-name-fix02-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_pa1_name_placeholder_key_000000000000
      NEXT_PUBLIC_SITE_URL: https://example.com
      PA1_SYNTHETIC_AI_EVAL: disabled
    steps:
      - name: Fail-closed live authorization guard
        shell: bash
        env:
          AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
          EXPECTED_SHA: ${{ github.sha }}
          LIVE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$AUTHORIZED_SHA" = "$EXPECTED_SHA"
          test "$LIVE_CONFIRMATION" = "RUN_AUTHORIZED_LIVE_EVAL"
          echo "PA1_TERRA_NAME_FIX02_MANUAL_AUTHORIZATION=PASS"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile
        run: npm ci --ignore-scripts

      - name: Scope main and frozen integrity
        shell: bash
        run: |
          set -euo pipefail
          BASE=a6f853beb17f572a9355093db514f91a0e2a09f9
          EXPECTED_MAIN=5d58f154a8fd18129e28614ccc038f0a6af66b8f
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"

          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/pa1-terra-name-fix02.yml
          src/features/ai/proposal-grounding.ts
          src/features/ai/proposal-name-grounding.test.ts
          src/features/ai/terra-live-synthetic-eval.test.ts
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -u /tmp/expected.txt -o /tmp/expected.txt
          git diff --name-only "$BASE" HEAD | sort -u > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

          git diff --exit-code "$BASE" -- \
            supabase \
            src/app \
            src/features/security \
            src/features/owner \
            src/features/prescriptions \
            package.json \
            package-lock.json

          test "$(git hash-object supabase/policies/0041_prescription_correction_window.sql)" = "b89f8759d737afee950567788a715ba9a947f175"
          test "$(git hash-object supabase/policies/0042_m3_prescription_reuse.sql)" = "f0d61c8ba472a57513eb0065a294a2ff65a09b69"
          test "$(git hash-object supabase/policies/0043_m3_signed_medicine_history.sql)" = "16b417bf3117d4e19bb9c52383af5e8608f59a91"
          test "$(git hash-object supabase/policies/0044_m3_prescription_print_audit.sql)" = "139684e77ef6fa2c5414611c32dfd8c6b9113524"
          test "$(git hash-object supabase/policies/0045_prelaunch_sec01b_security_closure.sql)" = "56a606e200a9f6ea43dd33e572511193a17a5f5a"
          test "$(git hash-object src/app/globals.css)" = "9e5d07175e729f142b4cff5574ded5af5a61bdbf"
          test "$(git hash-object src/features/prescriptions/components/print-sheet.tsx)" = "0b8afc336ff27faa0a33eaf22f6a8eac1b236c36"

          echo "PA1_TERRA_NAME_FIX02_SCOPE=PASS"
          echo "PA1_TERRA_NAME_FIX02_MAIN_BEFORE=$EXPECTED_MAIN"
          echo "PA1_TERRA_NAME_FIX02_FROZEN_INTEGRITY=PASS"

      - name: Focused name-grounding tests
        run: |
          npx vitest run \
            src/features/ai/proposal-name-grounding.test.ts \
            src/features/ai/proposal-grounding.test.ts

      - name: Schema compatibility and OpenAI provider tests
        run: |
          npx vitest run \
            src/features/ai/terra-schema-compat.test.ts \
            src/features/ai/openai-terra-provider.test.ts

      - name: Normal PA1 regression
        shell: bash
        env:
          PA1_SYNTHETIC_AI_EVAL: disabled
        run: |
          set -euo pipefail
          ai_tests=$(find src/features/ai -type f -name '*.test.ts' -print)
          voice_tests=$(find src/features/dictation -type f -name '*.test.ts' -print)
          test -n "$ai_tests$voice_tests"
          npx vitest run $ai_tests $voice_tests

      - name: M1 regression
        shell: bash
        run: |
          set -euo pipefail
          files=$(find src/features -type f -name '*m1*.test.ts' -print)
          test -n "$files"
          npx vitest run $files

      - name: M2 correction freeze print regression
        shell: bash
        run: |
          set -euo pipefail
          files=$(find src/features/prescriptions -type f \( -name '*correction*.test.ts' -o -name '*freeze*.test.ts' -o -name '*print*.test.ts' \) -print)
          test -n "$files"
          npx vitest run $files

      - name: Complete frozen M3 Prescription suite
        shell: bash
        run: |
          set -euo pipefail
          files=$(find src/features/prescriptions -type f -name '*.test.ts' -print)
          test -n "$files"
          npx vitest run $files

      - name: Complete repository tests
        run: npm test

      - name: Generate Next route types
        run: npx next typegen

      - name: TypeScript noEmit
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit-prod.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log(`PA1_TERRA_NAME_FIX02_PROD_AUDIT=${JSON.stringify(counts)}`);
          if ((counts.moderate ?? 0) !== 0 || (counts.high ?? 0) !== 0 || (counts.critical ?? 0) !== 0) {
            throw new Error(`production dependency gate failed: ${JSON.stringify(counts)}`);
          }
          NODE

      - name: Git diff check before live provider traffic
        run: git diff --check

      - name: Four-case correction gate then final full corpus
        shell: bash
        env:
          PA1_SYNTHETIC_AI_EVAL: enabled
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "PA1_TERRA_NAME_FIX02_SECRET_PRESENT=false"
            exit 1
          fi
          echo "PA1_TERRA_NAME_FIX02_SECRET_PRESENT=true"
          echo "PA1_TERRA_NAME_FIX02_MAX_FOUR_CASE_PROVIDER_CALLS=4"
          echo "PA1_TERRA_NAME_FIX02_FINAL_CORPUS_PROVIDER_CALLS=16"
          echo "PA1_TERRA_NAME_FIX02_RAW_PROVIDER_OUTPUT_LOGGED=false"
          npx vitest run src/features/ai/terra-live-synthetic-eval.test.ts --reporter=verbose

      - name: Final diff frozen integrity and main proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BASE=a6f853beb17f572a9355093db514f91a0e2a09f9
          EXPECTED_MAIN=5d58f154a8fd18129e28614ccc038f0a6af66b8f
          git diff --check
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git diff --exit-code "$BASE" -- \
            supabase \
            src/app \
            src/features/security \
            src/features/owner \
            src/features/prescriptions \
            package.json \
            package-lock.json
          test "$(git hash-object supabase/policies/0041_prescription_correction_window.sql)" = "b89f8759d737afee950567788a715ba9a947f175"
          test "$(git hash-object supabase/policies/0042_m3_prescription_reuse.sql)" = "f0d61c8ba472a57513eb0065a294a2ff65a09b69"
          test "$(git hash-object supabase/policies/0043_m3_signed_medicine_history.sql)" = "16b417bf3117d4e19bb9c52383af5e8608f59a91"
          test "$(git hash-object supabase/policies/0044_m3_prescription_print_audit.sql)" = "139684e77ef6fa2c5414611c32dfd8c6b9113524"
          test "$(git hash-object supabase/policies/0045_prelaunch_sec01b_security_closure.sql)" = "56a606e200a9f6ea43dd33e572511193a17a5f5a"
          test "$(git hash-object src/app/globals.css)" = "9e5d07175e729f142b4cff5574ded5af5a61bdbf"
          test "$(git hash-object src/features/prescriptions/components/print-sheet.tsx)" = "0b8afc336ff27faa0a33eaf22f6a8eac1b236c36"
          echo "PA1_TERRA_NAME_FIX02_NO_DB_AUTH_STORAGE_CLINICAL_WRITE_DELTA=PASS"
          echo "PA1_TERRA_NAME_FIX02_MAIN_AFTER=$EXPECTED_MAIN"
          echo "PA1_TERRA_NAME_FIX02_EXACT_SHA=$(git rev-parse HEAD)"
