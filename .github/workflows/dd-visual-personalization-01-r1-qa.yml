name: DD Visual Personalization 01 R1 QA

on:
  push:
    branches:
      - md2/dd-visual-personalization-01-r1

permissions:
  contents: read

env:
  BASE_SHA: 5d58f154a8fd18129e28614ccc038f0a6af66b8f
  GLOBALS_BLOB: 9e5d07175e729f142b4cff5574ded5af5a61bdbf
  ROOT_LAYOUT_BLOB: 7fca2775fc7980b4a29bea22b9130575acee1790
  OPENAI_API_KEY: ""
  DEEPGRAM_API_KEY: ""
  PA1_SYNTHETIC_AI_EVAL: disabled

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Scope and true-main-default guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/dd-visual-personalization-01-r1-qa.yml|\
              src/app/\(app\)/layout.tsx|\
              src/app/\(app\)/settings/page.tsx|\
              src/app/\(app\)/settings/appearance/page.tsx|\
              src/features/settings/background-preference.ts|\
              src/features/settings/background-appearance.test.ts|\
              src/features/settings/components/background-appearance.tsx|\
              src/features/settings/components/background-canvas.tsx)
                ;;
              *)
                echo "Unexpected changed file: $file" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
          test "$(git rev-parse HEAD:src/app/globals.css)" = "$GLOBALS_BLOB"
          test "$(git rev-parse HEAD:src/app/layout.tsx)" = "$ROOT_LAYOUT_BLOB"
          test ! -e src/app/global-background-test.css
          ! grep -R "global-background-test.css" src/app src/features
          if printf '%s\n' "$changed" | grep -E '(^|/)(supabase|migrations|policies)(/|$)|\.sql$'; then
            echo "Protected DB/schema surface changed" >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Appearance focused tests
        run: npx vitest run src/features/settings/background-appearance.test.ts

      - name: Full repository tests
        run: npm test

      - name: Next type generation
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check "$BASE_SHA"...HEAD
